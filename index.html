<script>
  (function() {
    try {
      var pref = localStorage.getItem('altiora_default_theme') || 'light';
      var t = pref === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : (pref === 'dark' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
/* ================================================================
   ALTIORA CORE v6.4 · Sistema de diseño dual (claro / oscuro)
   ================================================================ */
:root {
  --brand: #4f46e5;
  --brand-2: #4338ca;
  --brand-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --green: #10b981; --green-soft: #d1fae5;
  --amber: #f59e0b; --amber-soft: #fef3c7;
  --red: #ef4444; --red-soft: #fee2e2;
  --violet: #8b5cf6; --violet-soft: #ede9fe;
  --sky: #0ea5e9; --sky-soft: #e0f2fe;
  --radius: 16px; --radius-sm: 12px; --radius-xs: 8px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --trans: 200ms cubic-bezier(.4,0,.2,1);
}
/* TEMA CLARO */
[data-theme="light"], :root:not([data-theme="dark"]) {
  --bg: #f4f6fb;
  --bg-app: linear-gradient(180deg, #eef1f9 0%, #f4f6fb 100%);
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --line: #e2e8f0;
  --line-2: #cbd5e1;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 12px -2px rgba(15,23,42,.06);
  --shadow-lg: 0 20px 40px -12px rgba(15,23,42,.18);
  --sidebar-bg: #0f172a;
  --sidebar-ink: #94a3b8;
  --sidebar-active: #1e293b;
  --tabbar-bg: rgba(255,255,255,.92);
  --brand-soft: #eef2ff;
}
/* TEMA OSCURO */
[data-theme="dark"] {
  --bg: #0a0e1a;
  --bg-app: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 50%),
            radial-gradient(800px 500px at 110% 10%, #0c4a6e 0%, transparent 45%),
            #0a0e1a;
  --surface: #131826;
  --surface-2: #1a2032;
  --surface-3: #232a3d;
  --line: #232a3d;
  --line-2: #334155;
  --ink: #f1f5f9;
  --ink-2: #cbd5e1;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px -2px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 40px -12px rgba(0,0,0,.6);
  --sidebar-bg: #0d1320;
  --sidebar-ink: #64748b;
  --sidebar-active: #1e2a44;
  --tabbar-bg: rgba(19,24,38,.92);
  --brand-soft: rgba(99,102,241,.18);
  --green-soft: rgba(16,185,129,.15);
  --amber-soft: rgba(245,158,11,.15);
  --red-soft: rgba(239,68,68,.15);
  --violet-soft: rgba(139,92,246,.18);
  --sky-soft: rgba(14,165,233,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body {
  font-family: var(--font);
  background: var(--bg-app); background-attachment: fixed;
  color: var(--ink); font-size: 13px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  transition: background var(--trans), color var(--trans);
}
h1,h2,h3,h4,p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--brand); }
kbd { font-family: var(--font); font-size: 10px; border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; color: var(--muted); background: var(--surface); }
svg { display: block; }
.app { display: flex; min-height: 100vh; background: transparent; }
/* ============ SIDEBAR ============ */
.sidebar {
  width: 250px; flex: none; background: var(--sidebar-bg); color: var(--sidebar-ink);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40;
  border-right: 1px solid var(--line);
  transition: background var(--trans);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 20px; }
.brand-mark {

  font-weight: 800; font-size: 15px;
}
.brand-text strong { color: #f8fafc; font-size: 15px; font-weight: 700; letter-spacing: -.02em; display: block; }
.brand-text span { color: var(--sidebar-ink); font-size: 10px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; display: block; margin-top: 2px; }
.nav { flex: 1; padding: 4px 12px 16px; overflow-y: auto; }
.nav-group { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--sidebar-ink); font-weight: 700; padding: 18px 10px 8px; }
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; margin: 2px 0;
  border: 1px solid transparent; border-radius: 10px;

}
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item:hover { background: rgba(255,255,255,.04); color: #e2e8f0; }
.nav-item.is-active { background: var(--sidebar-active); color: #f8fafc; font-weight: 600; }
.nav-item.is-active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--brand-grad);
}
.nav-item.is-active svg { opacity: 1; color: #a5b4fc; }
.nav-badge { margin-left: auto; background: rgba(99,102,241,.2); color: #a5b4fc; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.nav-badge.amber { background: rgba(245,158,11,.2); color: #fbbf24; }
.nav-badge.emerald { background: rgba(16,185,129,.22); color: #34d399; }
.nav-badge.none { display: none; }
.sidebar-foot { padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.side-card {
  border-radius: 14px; padding: 14px; color: #fff; position: relative; overflow: hidden;
  background: var(--brand-grad); box-shadow: 0 10px 24px -8px rgba(99,102,241,.6);
}
.side-card::after {
  content: ''; position: absolute; right: -20px; top: -20px;
  width: 100px; height: 100px; border-radius: 999px; background: rgba(255,255,255,.12);
}
.side-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; font-weight: 600; }
.side-card-value { font-size: 20px; font-weight: 800; margin-top: 6px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.side-card .progress { margin-top: 10px; background: rgba(255,255,255,.25); height: 5px; border-radius: 99px; overflow: hidden; }
.side-card .progress > span { display: block; height: 100%; background: #fff; border-radius: 99px; }
.side-card-foot { display: flex; justify-content: space-between; font-size: 10px; margin-top: 8px; opacity: .9; }
.fx-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); padding: 0 2px; }
.fx-row input { width: 82px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 5px 8px; text-align: right; font-weight: 600; font-size: 11px; }
.cloud-pill { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 11px; font-weight: 500; cursor: pointer; text-align: left; transition: all var(--trans); }
.cloud-pill:hover { background: var(--surface-3); }
.dot { width: 7px; height: 7px; border-radius: 99px; background: var(--muted-2); flex: none; }
.dot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot.warn { background: var(--amber); }
.dot.bad { background: var(--red); }
.foot-note { font-size: 10px; color: var(--muted-2); line-height: 1.5; padding: 0 2px; }
.role-select { display: flex; flex-direction: column; gap: 5px; padding: 2px; }
.role-select label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); }
.role-select select {
  height: 32px; padding: 0 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink); font-size: 11px; font-weight: 600;
}
/* ============ TOPBAR ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--tabbar-bg); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
}
.page-heading h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); }
.page-heading p { font-size: 13px; color: var(--muted); margin-top: 3px; font-weight: 500; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search-pill {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  color: var(--muted); font-size: 12px; font-weight: 500;
  transition: all var(--trans);
}
.search-pill:hover { background: var(--surface-2); }
.search-pill svg { width: 15px; height: 15px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line);
  display: inline-grid; place-items: center; color: var(--ink-2);
  position: relative; transition: all var(--trans);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; }
.bell-dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 99px; background: var(--red); box-shadow: 0 0 0 2px var(--surface); }
.bell-count {
  position: absolute; top: -4px; right: -4px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--red); color: #fff;
  font-size: 9.5px; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--surface);
}
.user-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 38px;
  padding: 0 4px 0 4px; padding-right: 12px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
  font-size: 13px; font-weight: 600; color: var(--ink);
}
.avatar-sm {
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--brand-grad); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-left: 2px;
}
.user-chip svg { width: 13px; height: 13px; color: var(--muted); }
.view { padding: 22px 24px 100px; max-width: 1600px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
/* ============ GRIDS ============ */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
.g-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); }
.g-1-1-1 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
/* ============ CARDS ============ */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; transition: all var(--trans);
}
.card-head {
  padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
}
.card-head h3 { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.card-head h3 svg { width: 16px; height: 16px; color: var(--muted); }
.card-head > p { flex-basis: 100%; margin-top: -4px; }
.card-head p { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.card-body { padding: 18px 20px; }
.card-body.tight { padding: 0; }
.card-foot { padding: 13px 20px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
/* ============ KPIs MODERNOS ============ */
.kpi {
  position: relative; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  cursor: pointer; transition: all var(--trans); min-height: 128px;
}
.kpi:hover { border-color: var(--line-2); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.kpi-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 12px; background: var(--brand-soft); color: var(--brand); }
.kpi-ico svg { width: 17px; height: 17px; }
.kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kpi-val { font-size: 26px; font-weight: 800; margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -.03em; color: var(--ink); line-height: 1; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-weight: 500; }
.kpi-delta { font-weight: 700; display: inline-flex; align-items: center; gap: 2px; padding: 2px 7px; border-radius: 999px; font-size: 10px; }
.kpi-delta.up { background: var(--green-soft); color: var(--green); }
.kpi-delta.down { background: var(--red-soft); color: var(--red); }
.kpi-delta svg { width: 11px; height: 11px; }
.kpi-spark { position: absolute; right: 18px; bottom: 18px; width: 74px; height: 30px; opacity: .9; }
.kpi-grid > .kpi:first-child,
.grid.g4 > .kpi:first-child,
.grid.g5 > .kpi:first-child {
  background: var(--brand-grad); color: #fff; border-color: transparent;
}
.grid.g4 > .kpi:first-child .kpi-label,
.grid.g5 > .kpi:first-child .kpi-label,
.grid.g4 > .kpi:first-child .kpi-sub,
.grid.g5 > .kpi:first-child .kpi-sub,
.kpi-grid > .kpi:first-child .kpi-label,
.kpi-grid > .kpi:first-child .kpi-sub { color: rgba(255,255,255,.85); }
.grid.g4 > .kpi:first-child .kpi-val,
.grid.g5 > .kpi:first-child .kpi-val,
.kpi-grid > .kpi:first-child .kpi-val { color: #fff; }
.grid.g4 > .kpi:first-child .kpi-ico,
.grid.g5 > .kpi:first-child .kpi-ico,
.kpi-grid > .kpi:first-child .kpi-ico { background: rgba(255,255,255,.2); color: #fff; }
.kpi.emerald .kpi-ico { background: var(--green-soft); color: var(--green); }
.kpi.amber .kpi-ico { background: var(--amber-soft); color: var(--amber); }
.kpi.red .kpi-ico { background: var(--red-soft); color: var(--red); }
.kpi.violet .kpi-ico { background: var(--violet-soft); color: var(--violet); }
.kpi.sky .kpi-ico { background: var(--sky-soft); color: var(--sky); }
.kpi.navy .kpi-ico { background: var(--brand-soft); color: var(--brand); }
.kpi.red .kpi-val { color: var(--red); }
.kpi.emerald .kpi-val { color: var(--green); }
/* ============ BOTONES ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px;
  border-radius: 10px; border: 1px solid transparent;
  font-size: 13px; font-weight: 600; white-space: nowrap; text-decoration: none;
  transition: all var(--trans);
}
.btn:active { transform: scale(.97); }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px -2px rgba(79,70,229,.4); }
.btn-primary:hover { background: var(--brand-2); }
.btn-success { background: var(--green); color: #fff; box-shadow: 0 4px 12px -2px rgba(16,185,129,.4); }
.btn-success:hover { background: #059669; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
.btn-outline:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 11px; border-radius: 8px; }
.btn-sm svg { width: 13px; height: 13px; }
.btn-danger-ghost { background: transparent; color: var(--red); border-color: transparent; }
.btn-danger-ghost:hover { background: var(--red-soft); }
/* ============ BADGES ============ */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.b-green, .b-emerald { background: var(--green-soft); color: var(--green); }
.b-amber { background: var(--amber-soft); color: #b45309; }
.b-red { background: var(--red-soft); color: var(--red); }
.b-sky, .b-blue { background: var(--sky-soft); color: var(--sky); }
.b-violet { background: var(--violet-soft); color: var(--violet); }
.b-slate { background: var(--surface-3); color: var(--muted); }
[data-theme="dark"] .b-amber { color: #fbbf24; }
.badge b { font-weight: 800; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: all var(--trans); }
.chip:hover { background: var(--surface-2); }
.chip.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
[data-theme="dark"] .chip.is-active { background: var(--brand); color: #fff; border-color: var(--brand); }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* ============ TABLAS ============ */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 16px; background: transparent; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; }
.table td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--ink-2); }
.table tbody tr { transition: background var(--trans); }
.table tbody tr:hover td { background: var(--surface-2); }
.table tbody tr.is-click { cursor: pointer; }
.table tbody tr.is-void td { color: var(--muted-2); text-decoration: line-through; }
.table tfoot td { padding: 14px 16px; font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); color: var(--ink); }
.table .cell-main { display: flex; align-items: center; gap: 10px; }
.table .cell-main .avatar { width: 32px; height: 32px; font-size: 11px; border-radius: 9px; }
.table .cell-main .strong { white-space: nowrap; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
.strong { font-weight: 700; color: var(--ink); }
.sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.mono { font-variant-numeric: tabular-nums; }
.pos { color: var(--green); font-weight: 600; }
.neg { color: var(--red); font-weight: 600; }
.trunc { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ============ FORMULARIOS ============ */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px;
  padding: 0 12px; background: var(--surface-2); font-size: 13px; color: var(--ink);
  transition: all var(--trans);
}
.textarea { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--surface); }
.input:disabled, .select:disabled, .textarea:disabled { opacity: .6; cursor: not-allowed; }
.search { height: 38px; font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); font-weight: 500; }
.kv span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width var(--trans); }
.progress.green > span { background: var(--green); }
.progress.amber > span { background: var(--amber); }
.progress.red > span { background: var(--red); }
.splitbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.splitbar > i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; font-weight: 500; }
.legend b { color: var(--ink); font-weight: 700; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: 12px; }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--brand); background: var(--surface-2); padding: 12px 14px; border-radius: 10px; font-size: 12px; line-height: 1.6; color: var(--ink-2); }
.callout.warn { border-left-color: var(--amber); background: var(--amber-soft); color: var(--ink); }
.callout.danger { border-left-color: var(--red); background: var(--red-soft); color: var(--ink); }
.callout.good { border-left-color: var(--green); background: var(--green-soft); color: var(--ink); }
.callout b { font-weight: 700; }
/* ============ LISTAS / RUTA ============ */
.route-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); transition: background var(--trans); }
.route-item:last-child { border-bottom: 0; }
.route-item:hover { background: var(--surface-2); }
.route-item.done { background: var(--green-soft); }
.route-item.late { background: rgba(239,68,68,.04); }
.avatar {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--brand-soft); color: var(--brand);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; letter-spacing: .02em;
}
.avatar.blue { background: var(--brand-soft); color: var(--brand); }
.avatar.green { background: var(--green-soft); color: var(--green); }
.avatar.amber { background: var(--amber-soft); color: var(--amber); }
.avatar.violet { background: var(--violet-soft); color: var(--violet); }
.avatar.red { background: var(--red-soft); color: var(--red); }
.sem { width: 9px; height: 9px; border-radius: 99px; display: inline-block; flex: none; }
.sem.g { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.sem.a { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.sem.r { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.sem.b { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.sem.n { background: var(--muted-2); box-shadow: 0 0 0 3px var(--surface-3); }
.tabbar { display: flex; gap: 4px; overflow-x: auto; }
.tabbar button { border: 1px solid transparent; background: transparent; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 999px; white-space: nowrap; transition: all var(--trans); }
.tabbar button.is-active { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
.mini { font-size: 11px; color: var(--muted); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.rank { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); color: var(--ink-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
/* ============ CHARTS ============ */
.chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 6px; }
.chart-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
.chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 100%; width: 100%; justify-content: center; }
.chart-bars i { display: block; width: 42%; max-width: 16px; border-radius: 5px 5px 3px 3px; background: var(--brand); min-height: 3px; }
.chart-bars i.alt { background: var(--line-2); }
.chart-lbl { font-size: 10px; color: var(--muted-2); font-weight: 600; }
.donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut { flex: none; }
.donut-center { font-size: 14px; font-weight: 800; fill: var(--ink); }
.donut-center-sub { font-size: 8px; fill: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 2.2fr auto; align-items: center; gap: 12px; margin-bottom: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-name { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.bar-track { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar-track > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.bar-val { font-size: 12px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.alert-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); }
.alert-card + .alert-card { margin-top: 10px; }
.alert-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.alert-title { font-size: 12px; font-weight: 700; color: var(--ink); }
.alert-metric { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; color: var(--ink); }
.alert-metric small { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .04em; display: block; margin-top: 2px; }
.alert-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--muted); transition: all var(--trans); }
.seg button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
/* ============ MODALES · BOTTOM SHEET EN MÓVIL ============ */
.modal-backdrop { position: fixed; inset: 0; background: rgba(10,14,26,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .15s ease; }
.modal-card { background: var(--surface); width: 100%; max-width: 920px; max-height: 92vh; border-radius: 18px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); animation: slideUp .25s cubic-bezier(.32,.72,0,1); }
.modal-card.sm { max-width: 560px; }
.modal-card.lg { max-width: 1060px; }
.modal-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-head h3 { font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
.modal-head p { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; background: var(--surface-2); }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@media (max-width: 640px) {
  .modal-backdrop { align-items: flex-end; padding: 0; }
  .modal-card, .modal-card.sm, .modal-card.lg {
    max-width: 100%; border-radius: 24px 24px 0 0; max-height: 92vh;
    animation: slideUpSheet .3s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUpSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
}
/* ============ TOASTS ============ */
.toast-box { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 92vw; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 15px; border-radius: 12px; font-size: 12px; font-weight: 500; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; }
.toast.err { background: var(--red); color: #fff; }
.toast.ok { background: var(--green); color: #fff; }
.toast button { background: rgba(255,255,255,.2); color: inherit; border: 1px solid rgba(255,255,255,.3); border-radius: 7px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.doc-preview { white-space: normal; font-family: Georgia, "Times New Roman", serif; font-size: 12px; line-height: 1.75; background: #fff; color: #111; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; max-height: 470px; overflow-y: auto; }
/* ============ FIRMA DIGITAL ============ */
.signature-pad-wrap {
  border: 2px dashed var(--line-2); border-radius: 12px; background: var(--surface);
  padding: 8px; position: relative; overflow: hidden;
}
.signature-pad-wrap canvas {
  display: block; width: 100%; height: 120px;
  border-radius: 8px; background: #fff; cursor: crosshair; touch-action: none;
}
.signature-pad-wrap.has-signature { border-style: solid; border-color: var(--green); }
.signature-hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 6px; font-weight: 500; }
.gps-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 11px; font-weight: 600; color: var(--muted);
}
.gps-pill.captured { background: var(--green-soft); color: var(--green); border-color: transparent; }
/* ============ IMPRESIÓN ============ */
.print-area { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body > *:not(.print-area) { display: none !important; }
  .print-area { display: block !important; font-family: "Helvetica Neue", Arial, sans-serif; color: #000; font-size: 10.5px; }
  .p-head { display: flex; justify-content: space-between; border-bottom: 1.5px solid #111; padding-bottom: 9px; margin-bottom: 14px; }
  .p-brand { font-size: 16px; font-weight: 800; letter-spacing: .06em; }
  .p-box { border: 1px solid #b8c0c9; border-radius: 4px; padding: 9px 11px; margin-bottom: 10px; break-inside: avoid; }
  .p-box h4 { font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; color: #444; margin-bottom: 5px; }
  .p-table { width: 100%; border-collapse: collapse; font-size: 9.5px; }
  .p-table th, .p-table td { border: 1px solid #9aa3ad; padding: 4px 6px; text-align: left; }
  .p-table th { background: #eef1f4; font-size: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .p-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; margin-top: 38px; break-inside: avoid; }
  .p-sign { border-top: 1px solid #222; padding-top: 6px; text-align: center; font-size: 9px; }
  .thermal-ticket {
    font-family: "Courier New", Courier, monospace !important;
    color: #000 !important;
    margin: 0 auto !important;
    padding: 2mm !important;
    line-height: 1.35 !important;
  }
}
/* ============ RESPONSIVE ============ */
@media (max-width: 1240px) {
  .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-2-1, .g-1-2 { grid-template-columns: 1fr; }
}
.mobile-more-btn { display: none; }
.mobile-menu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mobile-menu-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  padding: 14px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  color: var(--ink-2); font-size: 11.5px; font-weight: 600; text-align: center;
  transition: all var(--trans);
}
.mobile-menu-tile:hover, .mobile-menu-tile.is-active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.mobile-menu-tile svg { width: 22px; height: 22px; }
@media (max-width: 980px) {
  .app { flex-direction: column; }
  .sidebar {
    position: fixed; bottom: 0; left: 0; right: 0; top: auto;
    width: 100%; height: auto; flex-direction: row;
    border-right: 0; border-top: 1px solid var(--line);
    background: var(--tabbar-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .brand, .sidebar-foot { display: none; }
  .nav {
    display: flex; flex-direction: row;
    justify-content: space-around; align-items: center;
    padding: 0 6px; width: 100%; overflow: visible;
  }
  .nav-group { display: none; }
  .nav-item[data-tab]:not([data-tab="dashboard"]):not([data-tab="ruta"]):not([data-tab="cartera"]):not([data-tab="cobros"]) {
    display: none !important;
  }
  .mobile-more-btn {
    display: flex !important;
  }
  .nav-item {
    flex-direction: column; gap: 3px; padding: 6px 6px;
    font-size: 10px; min-width: 0; flex: 1; max-width: 84px;
    justify-content: center; text-align: center; margin: 0;
  }
  .nav-item svg { width: 21px; height: 21px; }
  .nav-item.is-active::before { display: none; }
  .nav-badge { position: absolute; top: 2px; right: 50%; transform: translateX(14px); background: var(--red); color: #fff; font-size: 8px; font-weight: 800; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; margin-left: 0; display: grid; place-items: center; }
  .nav-badge.amber { background: var(--amber); }
  .main { padding-bottom: 0; }
  .view { padding: 16px 14px 110px; }
  .topbar { padding: 14px 16px; }
  .page-heading h1 { font-size: 18px; }
  .page-heading p { font-size: 11px; }
  .g4, .g5, .g6, .g3, .g2 { grid-template-columns: 1fr 1fr; }
  .kpi { min-height: auto; padding: 14px; }
  .kpi-val { font-size: 20px; }
  .kpi-label { font-size: 9px; }
  .kpi-ico { width: 28px; height: 28px; border-radius: 8px; margin-bottom: 8px; }
  .kpi-ico svg { width: 14px; height: 14px; }
  .card-head, .card-body { padding: 14px 16px; }
  .card-head h3 { font-size: 13px; }
}
@media (max-width: 640px) {
  .g2, .g3, .g4, .g5, .g6 { grid-template-columns: 1fr; }
  .search-pill { display: none; }
  .topbar-actions .btn:not(.btn-primary) { display: none; }
  .user-chip { padding: 4px 8px 4px 4px; cursor: pointer; }
  .user-chip span#user-name { display: inline-block; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
  .view { padding: 14px 12px 110px; gap: 12px; }
  .topbar { padding: 12px 14px; }
  .table th, .table td { padding: 10px 12px; font-size: 12px; }
  .route-item { padding: 14px; gap: 12px; }
  .avatar { width: 40px; height: 40px; font-size: 12px; border-radius: 11px; }
  .toast-box { bottom: 90px; right: 14px; left: 14px; max-width: none; }
}
/* ============ CORRECCIÓN MÓVIL ANTI-DESCUADRES & NOTIFICACIONES v6.4 ============ */
html, body { overflow-x: hidden; max-width: 100vw; -webkit-text-size-adjust: 100%; }
.app, .main, .view, .card { max-width: 100%; }
.period-bar {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 11px; padding: 3px 6px; font-size: 11.5px;
}
.period-bar select { height: 30px; border: 0; background: transparent; color: var(--ink); font-weight: 700; font-size: 11.5px; padding: 0 4px; cursor: pointer; }
.bulk-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; background: var(--brand-soft); border-bottom: 1px solid var(--brand);
  color: var(--ink); font-size: 12px; font-weight: 600; flex-wrap: wrap;
}
.chk-cell { width: 32px; text-align: center !important; padding: 10px 6px !important; }
.chk-cell input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand); }

@media (max-width: 980px) {
  .input, .select, .textarea, .fx-row input, .period-bar select { font-size: 16px !important; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal-card, .modal-card.sm, .modal-card.lg {
    width: 100vw !important; max-width: 100vw !important;
    max-height: 88dvh !important; border-radius: 20px 20px 0 0 !important; margin: 0 !important;
  }
  .modal-head { padding: 14px 16px; }
  .modal-body { padding: 14px 16px; overflow-x: hidden; }
  .modal-foot { padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  .toast-box {
    bottom: calc(74px + env(safe-area-inset-bottom)) !important;
    left: 10px !important; right: 10px !important; max-width: calc(100vw - 20px) !important;
  }
  .toast { width: 100%; justify-content: space-between; word-break: break-word; }
  .period-bar { width: 100%; justify-content: space-between; order: 3; }
}

/* ============ CORRECCIÓN SAFE-AREA iOS Y TARJETAS DE NOTIFICACIÓN v6.4 ============ */
.topbar {
  padding-top: calc(14px + env(safe-area-inset-top, 0px)) !important;
}

/* Tarjeta dedicada para notificaciones y listas con múltiples acciones */
.notif-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  transition: background var(--trans);
}
.notif-card:last-child {
  border-bottom: 0;
}
.notif-card.is-critical {
  background: rgba(239, 68, 68, 0.05);
}
.notif-card.is-read {
  opacity: 0.68;
}
.notif-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.notif-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  word-break: normal;
}
.notif-sub {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.45;
  margin-top: 2px;
}
.notif-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 4px;
}
.notif-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Widget de actualización de versión */
.update-widget {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--brand);
  background: var(--brand-soft);
}
.pin-input {
  text-align: center;
  font-size: 24px !important;
  font-weight: 800;
  letter-spacing: 0.45em;
  height: 52px;
}

/* Evita que .route-item en móvil comprima el texto central */
@media (max-width: 640px) {
  .topbar {
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px !important;
  }
  .modal-card, .modal-card.sm, .modal-card.lg {
    max-height: calc(100dvh - env(safe-area-inset-top, 20px) - 12px) !important;
  }
  .route-item {
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .route-item > div[style*="flex:1"] {
    min-width: calc(100% - 60px) !important;
  }
  .route-item > .right.nowrap,
  .route-item > .nowrap:last-child {
    margin-top: 6px;
  }
}

/* ============ MEJORAS v6.8: LOGO GITHUB, SELECCIÓN MASIVA, AGING Y LIQUIDACIÓN ============ */
.brand-mark { position: relative; overflow: hidden; }
.brand-mark img.brand-logo-img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 11px; display: none;
}
.brand-mark.has-custom-logo { background: transparent; box-shadow: none; }
.brand-mark.has-custom-logo img.brand-logo-img { display: block; }
.brand-mark.has-custom-logo svg { display: none; }

.bulk-action-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 18px; margin-bottom: 12px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(239,68,68,.12) 0%, rgba(79,70,229,.10) 100%);

 /* ============================================================
 1 · MOTOR DE AMORTIZACIÓN CON CALENDARIO REAL (MULTI-FRECUENCIA Y 0% INTERÉS)
 ============================================================ */

 function factorPeriodoFrecuencia(frecuencia) {
 switch (frecuencia) {
 case 'Diario': return 1 / 30;
 case 'Semanal': return 7 / 30;
 case 'Quincenal': return 0.5;
 case 'Trimestral': return 3;
 case 'Semestral': return 6;
 case 'Anual': return 12;

 }
 }

 function diasPagoDe(p) {
 var arr = Array.isArray(p.diasPago) ? p.diasPago : String(p.diasPago || '').split(/[^0-9]+/).filter(Boolean).map(Number);
 arr = (arr || []).map(Number).filter(function (n) { return n >= 1 && n <= 31; });
 if (!arr.length) arr = p.frecuencia === 'Quincenal' ? [15, 30] : [dayOf(p.fechaInicio || todayISO())];
 return arr.sort(function (a, b) { return a - b; });
 }

 function fechasCuotas(fechaInicio, n, frecuencia, diasPago) {
 var start = parseISO(fechaInicio || todayISO());
 var base = fmtISO(start);
 var days = (diasPago || []).map(Number).filter(function (x) { return x >= 1 && x <= 31; }).sort(function (a, b) { return a - b; });
 if (!days.length) days = frecuencia === 'Quincenal' ? [15, 30] : [start.getDate()];
 var out = [], guard = 0;

 if (frecuencia === 'Diario') {
 for (var dIdx = 0; dIdx < n; dIdx++) out.push(isoAddDays(base, dIdx));
 return out;
 }
 if (frecuencia === 'Semanal') {
 for (var wIdx = 0; wIdx < n; wIdx++) out.push(isoAddDays(base, wIdx * 7));
 return out;
 }
 if (frecuencia === 'Quincenal') {
 if (days.length > 1) {
 var y = start.getFullYear(), m = start.getMonth();
 while (out.length < n && guard++ < 600) {
 var dim = new Date(y, m + 1, 0).getDate();
 for (var i = 0; i < days.length && out.length < n; i++) {
 var cand = new Date(y, m, Math.min(days[i], dim), 12, 0, 0);
 if (cand >= start) out.push(fmtISO(cand));
 }
 m++; if (m > 11) { m = 0; y++; }
 }
 } else {
 for (var qIdx = 0; qIdx < n; qIdx++) out.push(isoAddDays(base, qIdx * 15));
 }
 return out.slice(0, n).sort();
 }

 var stepMonths = frecuencia === 'Trimestral' ? 3 : frecuencia === 'Semestral' ? 6 : frecuencia === 'Anual' ? 12 : 1;
 for (var k = 0; k < n && guard++ < 600; k++) {
 var d = parseISO(isoAddMonths(base, k * stepMonths));
 if (days[0] === 31) d = new Date(d.getFullYear(), d.getMonth() + 1, 0, 12, 0, 0);
 else d = new Date(d.getFullYear(), d.getMonth(), Math.min(days[0], lastDayOfMonth(d.getFullYear(), d.getMonth())), 12, 0, 0);
 if (d >= start) out.push(fmtISO(d));
 else {
 var nextD = parseISO(isoAddMonths(base, (k + 1) * stepMonths));
 nextD = new Date(nextD.getFullYear(), nextD.getMonth(), Math.min(days[0], lastDayOfMonth(nextD.getFullYear(), nextD.getMonth())), 12, 0, 0);
 out.push(fmtISO(nextD));
 }
 }
 return out.slice(0, n).sort();
 }

 function calcSchedule(capital, tasaMesPct, cuotas, sistema, frecuencia, fechaInicio, diasPago) {
 capital = num(capital);
 cuotas = Math.max(1, parseInt(cuotas, 10) || 1);
 sistema = sistema || 'interes';
 frecuencia = frecuencia || 'Quincenal';
 tasaMesPct = sistema === 'capital' ? 0 : num(tasaMesPct);
 var rPer = (tasaMesPct / 100) * factorPeriodoFrecuencia(frecuencia);
 var fechas = fechasCuotas(fechaInicio || todayISO(), cuotas, frecuencia, diasPago);
 var saldo = capital, cuotaFija = 0, rows = [], totalInt = 0, totalPag = 0;

 if (sistema === 'capital') {
 cuotaFija = cuotas > 0 ? (capital / cuotas) : capital;
 } else if (sistema === 'frances') {
 cuotaFija = rPer > 0 ? (capital * (rPer * Math.pow(1 + rPer, cuotas)) / (Math.pow(1 + rPer, cuotas) - 1)) : (capital / cuotas);
 } else if (sistema === 'flat') {
 cuotaFija = (capital / cuotas) + (capital * rPer);
 } else {
 cuotaFija = capital * rPer;
 }
 cuotaFija = r2(cuotaFija);

 for (var i = 1; i <= cuotas; i++) {
 var interes = 0, abono = 0;
 if (sistema === 'capital') {
 interes = 0;
 abono = i === cuotas ? r2(saldo) : r2(capital / cuotas);
 } else if (sistema === 'frances') {
 interes = r2(saldo * rPer);
 abono = i === cuotas ? r2(saldo) : r2(cuotaFija - interes);
 } else if (sistema === 'flat') {
 interes = r2(capital * rPer);
 abono = i === cuotas ? r2(saldo) : r2(capital / cuotas);
 } else {
 interes = r2(capital * rPer);
 abono = i === cuotas ? r2(saldo) : 0;
 }
 abono = Math.max(0, Math.min(abono, saldo));
 var cuotaTotal = r2(interes + abono);
 saldo = r2(Math.max(0, saldo - abono));
 totalInt = r2(totalInt + interes);
 totalPag = r2(totalPag + cuotaTotal);
 rows.push({
 n: i, fecha: fechas[i - 1] || isoAddMonths(fechaInicio, i),
 interes: interes, capital: abono, cuotaTotal: cuotaTotal, saldo: saldo,

 }
 return {

 function generarCuotas(p) {

 var sched = calcSchedule(p.capitalDOP, p.tasaMesPct, p.plazo, p.sistema, p.frecuencia, p.fechaInicio, diasPagoDe(p));
 p.cuotas = sched.rows;
 return p.cuotas;
 }

 function recalcularInteresSobreSaldoInsoluto(p) {

 var nuevoSaldoCap = saldoCapitalP(p);
 var rPer = (num(p.tasaMesPct) / 100) * factorPeriodoFrecuencia(p.frecuencia || 'Mensual');
 var nuevoInteresPeriodo = r2(Math.max(0, nuevoSaldoCap * rPer));
 (p.cuotas || []).forEach(function (c) {
 if (cuotaPagada(c)) return;
 if (num(c.pagadoInt) < nuevoInteresPeriodo) {
 c.interes = nuevoInteresPeriodo;
 } else {
 c.interes = r2(num(c.pagadoInt));
 }
 c.cuotaTotal = r2(num(c.interes) + num(c.capital));
 });
 return nuevoInteresPeriodo;
 }

 /* ============================================================
 2 · ESTADO DE CUOTAS, SALDOS Y MORA
 ============================================================ */

 function cuotaPagada(c) { return num(c.pagadoInt) + num(c.pagadoCap) >= num(c.cuotaTotal) - 0.02; }
 function cuotaPendiente(c) { return r2(Math.max(0, num(c.cuotaTotal) - num(c.pagadoInt) - num(c.pagadoCap))); }
 function cuotaEstado(c, hoy) {
 hoy = hoy || todayISO();
 if (cuotaPagada(c)) return 'Pagada';
 var pagado = num(c.pagadoInt) + num(c.pagadoCap);
 if (c.fecha && c.fecha > hoy) return pagado > 0.01 ? 'Parcial' : 'Pendiente';
 if (pagado > 0.01) return 'Vencida Parcial';

 }
 function diasAtrasoCuota(c, hoy) {
 hoy = hoy || todayISO();

 }

 var cfg = moraConfig();
 var diasEf = atraso - cfg.diasGracia;
 if (diasEf <= 0) return 0;
 var base = cuotaPendiente(c);
 var calc;
 if (cfg.modo === 'fijo') calc = cfg.valor * Math.max(1, Math.ceil(diasEf / 30));
 else calc = base * (cfg.valor / 100) * (cfg.prorrateoDiario ? diasEf / 30 : Math.ceil(diasEf / 30));

 }

 function saldoCapitalP(p) { var totCap = sum(p.cuotas, function (c) { return num(c.capital); }) || num(p.capitalDOP); var totPag = sum(p.cuotas, function (c) { return num(c.pagadoCap); }); return r2(Math.max(0, totCap - totPag)); }
 function saldoInteresP(p) { return r2(sum(p.cuotas, function (c) { return Math.max(0, num(c.interes) - num(c.pagadoInt)); })); }

 }
 function atrasoDiasP(p, hoy) {

 }

 .sort(function (a, b) { return a.fechaCompromiso < b.fechaCompromiso ? -1 : 1; })[0] || null;

 if (p.estadoManual === 'Liquidado') return 'Liquidado';
 if (!p.cuotas || !p.cuotas.length) return 'Liquidado';

 }

 function calcularScoreDeudor(deudorId) {
  var d = (db && db.deudores || []).filter(function (x) { return x.id === deudorId; })[0];
  if (!d) return { score: 75, clase: 'B · Confiable', badge: 'b-sky', limiteSugerido: 50000, puntuales: 0, atrasos: 0 };
  var prestamos = (db.prestamos || []).filter(function (p) { return p.deudorId === deudorId; });
  var recibos = recibosValidos().filter(function (r) { return r.deudorId === deudorId; });
  var promesas = (db.promesas || []).filter(function (pr) { return pr.deudorId === deudorId; });
  var score = 78;
  var cuotasPagadas = 0, cuotasEnMora = 0, maxDiasMora = 0;
  var hoy = todayISO();
  prestamos.forEach(function (p) {
   if (estadoPrestamo(p, hoy) === 'Liquidado') score += 6;
   (p.cuotas || []).forEach(function (c) {
    if (cuotaPagada(c)) cuotasPagadas++;
    else if (c.fecha < hoy) {
     cuotasEnMora++;
     var dm = daysBetween(c.fecha, hoy);
     if (dm > maxDiasMora) maxDiasMora = dm;
    }
   });
  });
  score += Math.min(18, cuotasPagadas * 2);
  score += Math.min(8, recibos.length);
  score -= cuotasEnMora * 9;
  if (maxDiasMora > 30) score -= 18;
  else if (maxDiasMora > 7) score -= 8;
  var promCumplidas = promesas.filter(function (x) { return x.estado === 'Cumplida'; }).length;
  var promIncumplidas = promesas.filter(function (x) { return x.estado === 'Incumplida' || (x.estado === 'Pendiente' && x.fechaCompromiso < hoy); }).length;
  score += promCumplidas * 3;
  score -= promIncumplidas * 10;
  score = clamp(Math.round(score), 15, 100);

  var baseIng = num(d.ingresosDOP) || 45000;
  var factorLim = score >= 85 ? 2.2 : score >= 70 ? 1.5 : score >= 55 ? 0.9 : 0.4;
  var limSug = Math.round((baseIng * factorLim) / 1000) * 1000;
  var clase = score >= 85 ? 'A+ · Excelente' : score >= 70 ? 'B · Confiable' : score >= 55 ? 'C · Observación' : 'D · Alto Riesgo';
  var badge = score >= 85 ? 'b-green' : score >= 70 ? 'b-sky' : score >= 55 ? 'b-amber' : 'b-red';
  return { score: score, clase: clase, badge: badge, limiteSugerido: limSug, puntuales: cuotasPagadas, atrasos: cuotasEnMora, maxDiasMora: maxDiasMora };
 }

 function proyeccionCapitalDisponible() {
  var hoy = todayISO();
  var ventanas = [7, 15, 30];
  var out = {};
  ventanas.forEach(function (dias) {
   var lim = isoAddDays(hoy, dias);
   var cap = 0, int = 0, cuotasCount = 0;
   (db.prestamos || []).forEach(function (p) {
    if (estadoPrestamo(p, hoy) === 'Liquidado') return;
    (p.cuotas || []).forEach(function (c) {
     if (cuotaPagada(c)) return;

      cuotasCount++;
     }
    });
   });
   out['d' + dias] = { dias: dias, capital: r2(cap), interes: r2(int), total: r2(cap + int), cuotas: cuotasCount };
  });

 /* Matriz de Antigüedad de Cartera (Aging Buckets: Al Día, 1-30, 31-60, 61-90, +90) */
 function calcAgingCartera() {
  var hoy = todayISO();
  var buckets = [
   { id: 'AL_DIA', label: '0 días (Al día)', min: 0, max: 0, count: 0, saldoCap: 0, vencido: 0, badge: 'b-green' },
   { id: '1_30', label: '1 – 30 días', min: 1, max: 30, count: 0, saldoCap: 0, vencido: 0, badge: 'b-sky' },
   { id: '31_60', label: '31 – 60 días', min: 31, max: 60, count: 0, saldoCap: 0, vencido: 0, badge: 'b-amber' },
   { id: '61_90', label: '61 – 90 días', min: 61, max: 90, count: 0, saldoCap: 0, vencido: 0, badge: 'b-red' },
   { id: '90_PLUS', label: '+90 días (Crítica)', min: 91, max: 99999, count: 0, saldoCap: 0, vencido: 0, badge: 'b-red' }
  ];
  (db.prestamos || []).forEach(function (p) {
   if (estadoPrestamo(p, hoy) === 'Liquidado') return;
   var d = atrasoDiasP(p, hoy);
   var sc = saldoCapitalP(p);
   var vc = vencidoP(p, hoy);
   var b = buckets[0];
   if (d >= 91) b = buckets[4];

   else if (d >= 1) b = buckets[1];
   b.count++;
   b.saldoCap = r2(b.saldoCap + sc);
   b.vencido = r2(b.vencido + vc);
  });
  return buckets;
 }

 /* Cotizador de Liquidación Anticipada / Saldo Total a Fecha de Corte (Payoff Quote Calculator) */
 function calcularLiquidacionAlDia(p, fechaCorte, descInteresPct, exonerarMora) {
  if (!p) return null;
  fechaCorte = fechaCorte || todayISO();
  descInteresPct = clamp(num(descInteresPct), 0, 100);
  var capInsoluto = saldoCapitalP(p);
  var moraAcum = exonerarMora ? 0 : moraTotalP(p, fechaCorte);
  var intVencido = 0;
  var intProrrateado = 0;
  var diasTranscurridos = 0;

  var pendientes = (p.cuotas || []).filter(function (c) { return !cuotaPagada(c); })
   .sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });

  var prevFecha = p.fechaInicio || todayISO();
  (p.cuotas || []).forEach(function (c) {
   if (cuotaPagada(c) && c.fecha <= fechaCorte) prevFecha = c.fecha;
  });

  pendientes.forEach(function (c, idx) {
   var intPend = r2(Math.max(0, num(c.interes) - num(c.pagadoInt)));
   if (c.fecha <= fechaCorte) {
    intVencido = r2(intVencido + intPend);
    prevFecha = c.fecha;
   } else if (idx === 0 || (pendientes[idx - 1] && pendientes[idx - 1].fecha <= fechaCorte)) {
    var diasPeriodo = Math.max(1, daysBetween(prevFecha, c.fecha));
    diasTranscurridos = clamp(daysBetween(prevFecha, fechaCorte), 0, diasPeriodo);
    intProrrateado = r2(intPend * (diasTranscurridos / diasPeriodo));
   }
  });

  var intBruto = r2(intVencido + intProrrateado);
  var descuentoDOP = r2(intBruto * (descInteresPct / 100));
  var intNeto = r2(Math.max(0, intBruto - descuentoDOP));
  var totalLiquidar = r2(capInsoluto + intNeto + moraAcum);
  var intFuturoAhorrado = r2(Math.max(0, saldoInteresP(p) - intNeto));

  return {
   prestamoId: p.id,
   deudor: p.deudor,
   fechaCorte: fechaCorte,
   capitalInsoluto: capInsoluto,
   interesVencido: intVencido,
   interesProrrateado: intProrrateado,
   diasTranscurridos: diasTranscurridos,
   descuentoDOP: descuentoDOP,
   interesNeto: intNeto,
   moraTotal: moraAcum,
   totalLiquidar: totalLiquidar,
   ahorroFuturo: intFuturoAhorrado
  };
 }

 function generarHashVerificacionRecibo(rec) {
  var raw = [rec.id, rec.prestamoId, rec.fecha, num(rec.montoDOP).toFixed(2), rec.ncf || 'INTERNAL'].join('|');
  var h1 = 0x811c9dc5, h2 = 0x1b873593;
  for (var i = 0; i < raw.length; i++) {
   var c = raw.charCodeAt(i);
   h1 ^= c; h1 = Math.imul(h1, 0x01000193) >>> 0;
   h2 ^= (c * 31); h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
  }
  return 'ALT-' + h1.toString(16).toUpperCase().padStart(8, '0').slice(0, 4) + '-' + h2.toString(16).toUpperCase().padStart(8, '0').slice(0, 4);
 }


 /* ============================================================
 3 · APLICACIÓN DE PAGOS (cascada mora interés capital + Abono Extraordinario con Recálculo)
 ============================================================ */

 function aplicarPago(p, opts) {
 var hoy = opts.fecha || todayISO();
 var monto = r2(opts.monto);
 if (monto <= 0) return null;
 var restante = monto;
 var res = { mora: 0, interes: 0, capital: 0, exonerado: 0, detalle: [], nuevoInteresPeriodo: null };

 var pendientes = p.cuotas.filter(function (c) { return !cuotaPagada(c); })
 .sort(function (a, b) { return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : a.n - b.n); });

 if (opts.cuotaN) {
 pendientes.sort(function (a, b) {
 if (a.n === opts.cuotaN) return -1;
 if (b.n === opts.cuotaN) return 1;
 return 0;
 });
 }

 // 1) Mora vencida
 if (opts.cobrarMora !== false) {
 pendientes.forEach(function (c) {
 if (restante <= 0) return;
 var mora = moraPendiente(c, hoy);
 if (mora <= 0) return;
 var pago = Math.min(mora, restante);
 c.moraPagada = r2(num(c.moraPagada) + pago);
 res.mora = r2(res.mora + pago);
 restante = r2(restante - pago);
 res.detalle.push({ n: c.n, tipo: 'Mora', monto: pago });
 });
 } else if (opts.exonerarMora) {
 pendientes.forEach(function (c) {
 var mora = moraPendiente(c, hoy);
 if (mora > 0) { c.moraExonerada = r2(num(c.moraExonerada) + mora); res.exonerado = r2(res.exonerado + mora); }
 });
 }

 var modoRecalculoSoloInteres = (p.sistema === 'interes' && opts.recalcularInteres !== false);

 if (modoRecalculoSoloInteres) {
 var cuotasExigibles = pendientes.filter(function (c, idx) {
 return c.fecha <= hoy || idx === 0 || (opts.cuotaN && c.n === opts.cuotaN);
 });
 cuotasExigibles.forEach(function (c) {
 if (restante <= 0) return;
 var intPend = r2(Math.max(0, num(c.interes) - num(c.pagadoInt)));
 if (intPend > 0) {
 var pi = Math.min(intPend, restante);
 c.pagadoInt = r2(num(c.pagadoInt) + pi);
 res.interes = r2(res.interes + pi);
 restante = r2(restante - pi);
 res.detalle.push({ n: c.n, tipo: 'Interés', monto: pi });
 }
 });
 if (restante > 0.009) {
 var ultimaCap = p.cuotas.filter(function (c) { return num(c.capital) - num(c.pagadoCap) > 0.009; }).pop() || p.cuotas[p.cuotas.length - 1];
 if (ultimaCap) {
 var dispCap = r2(Math.max(0, num(ultimaCap.capital) - num(ultimaCap.pagadoCap)));
 var abonoCap = Math.min(dispCap, restante);
 if (abonoCap > 0) {
 ultimaCap.pagadoCap = r2(num(ultimaCap.pagadoCap) + abonoCap);
 res.capital = r2(res.capital + abonoCap);
 restante = r2(restante - abonoCap);
 res.detalle.push({ n: ultimaCap.n, tipo: 'Capital extra', monto: abonoCap });
 res.sobrante = abonoCap;
 }
 }
 }
 }

 // 2) Interés y 3) Capital normal
 pendientes.forEach(function (c) {
 if (restante <= 0) return;
 var intPend = r2(Math.max(0, num(c.interes) - num(c.pagadoInt)));
 if (intPend > 0) {
 var pi = Math.min(intPend, restante);
 c.pagadoInt = r2(num(c.pagadoInt) + pi);
 res.interes = r2(res.interes + pi);
 restante = r2(restante - pi);
 res.detalle.push({ n: c.n, tipo: 'Interés', monto: pi });
 }
 if (restante <= 0) return;
 var capPend = r2(Math.max(0, num(c.capital) - num(c.pagadoCap)));
 if (capPend > 0) {
 var pc = Math.min(capPend, restante);
 c.pagadoCap = r2(num(c.pagadoCap) + pc);
 res.capital = r2(res.capital + pc);
 restante = r2(restante - pc);
 res.detalle.push({ n: c.n, tipo: 'Capital', monto: pc });
 }
 });

 // 4) Excedente final
 if (restante > 0.009) {
 var ultima = p.cuotas.filter(function (c) { return !cuotaPagada(c); }).pop() || p.cuotas[p.cuotas.length - 1];
 if (ultima) {
 ultima.pagadoCap = r2(num(ultima.pagadoCap) + restante);
 res.capital = r2(res.capital + restante);
 res.detalle.push({ n: ultima.n, tipo: 'Capital extra', monto: restante });
 res.sobrante = r2(num(res.sobrante) + restante);
 restante = 0;
 }
 }

 if (p.sistema === 'interes' && res.capital > 0 && opts.recalcularInteres !== false) {
 res.nuevoInteresPeriodo = recalcularInteresSobreSaldoInsoluto(p);
 }

 res.total = r2(res.mora + res.interes + res.capital);
 res.aplicado = r2(monto - restante);
 res.fecha = hoy;
 res.cuotasAfectadas = res.detalle.filter(function (d) { return d.tipo !== 'Mora'; }).map(function (d) { return d.n; })
 .filter(function (v, i, a) { return a.indexOf(v) === i; });
 return res;
 }

 function registrarCobro(p, opts) {
 var res = aplicarPago(p, opts);
 if (!res) return null;
 var ncfEmitido = opts.ncfManual || (opts.ncfTipo && opts.ncfTipo !== 'SIN_NCF' ? consumeNextNcf(opts.ncfTipo) : '');
 var recibo = {
 id: uid('REC'), fecha: res.fecha, prestamoId: p.id, deudorId: p.deudorId, deudor: p.deudor,
 montoDOP: res.total, moraDOP: res.mora, interesDOP: res.interes, capitalDOP: res.capital,
 exoneradoDOP: res.exonerado, cuentaId: opts.cuentaId, metodo: opts.metodo || 'Efectivo',
 nota: opts.nota || '', detalle: res.detalle, saldoCapitalDOP: saldoCapitalP(p), cuotaN: opts.cuotaN || null,
 ncf: ncfEmitido || '', ncfTipo: opts.ncfTipo || '',
 nuevoInteresPeriodo: res.nuevoInteresPeriodo,
 estado: 'Registrado', grupo: uid('GRP')
 };
 recibo.hashVerificacion = generarHashVerificacionRecibo(recibo);
 if (num(p.socioPct) > 0 && p.socioNombre) {
  recibo.socioNombre = p.socioNombre;
  recibo.socioPct = num(p.socioPct);
  recibo.socioMontoDOP = r2(res.interes * (num(p.socioPct) / 100));
 }
 db.recibos.unshift(recibo);

 if (opts.cuentaId) {
 registrarMovimiento({
 fecha: res.fecha, cuentaId: opts.cuentaId, tipo: 'Ingreso', flujo: 'Cobro de Cartera',
 categoria: 'Cobro de Cuota', concepto: 'Recibo ' + recibo.id + (ncfEmitido ? ' (' + ncfEmitido + ')' : '') + ' · ' + p.deudor,
 monto: res.total, metodo: opts.metodo || 'Efectivo', refType: 'prestamo', refId: p.id,
 reciboId: recibo.id, grupo: recibo.grupo, ncf: ncfEmitido || '',
 cap: res.capital, int: res.interes, mora: res.mora
 });
 if (num(p.socioPct) > 0 && p.socioNombre && res.interes > 0) {
  var partSocio = r2(res.interes * (num(p.socioPct) / 100));
  if (partSocio > 0) {
   registrarMovimiento({
    fecha: res.fecha, cuentaId: opts.cuentaId, tipo: 'Egreso', flujo: 'Terceros',
    categoria: 'Participación Co-Inversionista',
    concepto: 'Participación ' + pct(p.socioPct) + ' socio ' + p.socioNombre + ' · Recibo ' + recibo.id,
    monto: partSocio, metodo: 'Custodia Interna', refType: 'prestamo', refId: p.id,
    reciboId: recibo.id, grupo: recibo.grupo, aplicaDgii: false
   });
  }
 }
 }
 var pr = promesaActiva(p);
 if (pr && pr.fechaCompromiso <= res.fecha) pr.estado = 'Cumplida';
 return recibo;
 }

 /* ============================================================
 4 · TESORERÍA: CUENTAS, MOVIMIENTOS, DGII
 ============================================================ */

 function cuentaPorId(id) { return db.cuentas.filter(function (c) { return c.id === id; })[0] || null; }
 function nombreCuenta(id) { var c = cuentaPorId(id); return c ? c.nombre : 'Sin cuenta'; }
 function esBancaria(id) { var c = cuentaPorId(id); return !!c && (c.tipo === 'Banco' || c.tipo === 'Línea / Tarjeta'); }

 function movsValidos() { return db.movimientos.filter(function (m) { return m.estado !== 'Anulado'; }); }
 function recibosValidos() { return db.recibos.filter(function (r) { return r.estado !== 'Anulado'; }); }

 function saldoCuenta(id) {
 var c = cuentaPorId(id);
 if (!c) return 0;
 var s = num(c.saldoInicialDOP != null ? c.saldoInicialDOP : c.saldoInicial);
 movsValidos().forEach(function (m) {
 var v = num(m.montoDOP != null ? m.montoDOP : m.monto);
 var tax = num(m.dgiiDOP);
 if (m.tipo === 'Transferencia') {
 if (m.cuentaId === id) s -= (v + tax);
 if (m.cuentaDestinoId === id) s += v;
 } else if (m.cuentaId === id) {
 s += (m.tipo === 'Ingreso' ? v : -(v + tax));
 }
 });
 return r2(s);
 }
 function liquidezTotal() {
 return r2(sum(db.cuentas.filter(function (c) { return c.tipo !== 'Línea / Tarjeta' && c.activo !== false; }), function (c) { return saldoCuenta(c.id); }));
 }

 function registrarMovimiento(mv) {
 var mov = {
 id: uid('MOV'), fecha: mv.fecha || todayISO(), cuentaId: mv.cuentaId || '',
 cuentaDestinoId: mv.cuentaDestinoId || '', tipo: mv.tipo || 'Ingreso',
 flujo: mv.flujo || 'Operativo', categoria: mv.categoria || 'Operación General',
 concepto: mv.concepto || '', montoDOP: r2(mv.monto), metodo: mv.metodo || 'Efectivo',
 dgiiDOP: 0, refType: mv.refType || '', refId: mv.refId || '', reciboId: mv.reciboId || '',
 ncf: mv.ncf || '', grupo: mv.grupo || '', estado: 'Registrado', cap: r2(mv.cap || 0), int: r2(mv.int || 0), mora: r2(mv.mora || 0)
 };
 if (mv.aplicaDgii === true || (mv.aplicaDgii !== false && mov.tipo === 'Egreso' && esBancaria(mov.cuentaId) && /Transfer|Cheque/i.test(mov.metodo))) {

 }

 }

 /* ============================================================
 5 · MÉTRICAS CONSOLIDADAS DEL HOLDING
 ============================================================ */

 function metrics() {
 var hoy = todayISO();
 var factor = periodMonthsFactor();
 var activos = db.prestamos.filter(function (p) { return estadoPrestamo(p, hoy) !== 'Liquidado'; });
 var saldoCapital = r2(sum(activos, saldoCapitalP));
 var capitalColocado = r2(sum(activos, function (p) { return num(p.capitalDOP); }));
 var vencido = r2(sum(activos, function (p) { return vencidoP(p, hoy); }));
 var mora = r2(sum(activos, function (p) { return moraTotalP(p, hoy); }));
 var enMora = activos.filter(function (p) { return atrasoDiasP(p, hoy) > 0; });
 var promesas = db.promesas.filter(function (x) { return x.estado === 'Pendiente'; });
 var promesasVencidas = promesas.filter(function (x) { return x.fechaCompromiso < hoy; });

 var recibosMes = recibosValidos().filter(function (r) { return inGlobalPeriod(r.fecha); });
 var interesMes = r2(sum(recibosMes, function (r) { return num(r.interesDOP); }));
 var moraMes = r2(sum(recibosMes, function (r) { return num(r.moraDOP); }));
 var capitalRecuperadoMes = r2(sum(recibosMes, function (r) { return num(r.capitalDOP); }));

 var movsPer = movsValidos().filter(function (m) { return inGlobalPeriod(m.fecha); });
 var ingMes = r2(sum(movsPer.filter(function (m) { return m.tipo === 'Ingreso'; }), function (m) { return num(m.montoDOP); }));
 var egrMes = r2(sum(movsPer.filter(function (m) { return m.tipo === 'Egreso'; }), function (m) { return num(m.montoDOP); }));
 var dgiiMes = r2(sum(movsPer, function (m) { return num(m.dgiiDOP); }));
 var tercerosCustodia = r2(sum(db.tramites, function (t) { return Math.max(0, num(t.fondoImpuestosDOP) - num(t.impuestosPagadosDOP)); }));

 var deudaTotal = r2(sum(db.pasivos, function (x) { return num(x.saldoDOP); }));
 var servicioDeudaBaseMes = r2(sum(db.pasivos, function (x) { return num(x.cuotaDOP); }));
 var igualasBaseMes = r2(sum(db.igualas.filter(function (x) { return x.estado === 'Activa'; }), function (x) { return num(x.montoDOP); }));
 var rentasBaseMes = r2(sum(db.alquileres, function (x) { return num(x.rentaDOP) * num(x.comisionPct) / 100; }));
 var rentCarIngMes = r2(sum(movsPer.filter(function (m) { return m.tipo === 'Ingreso' && m.flujo === 'Holding / Rent Car'; }), function (m) { return num(m.montoDOP); }));

 var servicioDeudaMes = r2(servicioDeudaBaseMes * factor);
 var igualasMes = r2(igualasBaseMes * factor);
 var rentasMes = r2(rentasBaseMes * factor);

 var patrimonioInmuebles = r2(sum(db.inmuebles, function (i) { return num(i.valorDOP); }));
 var costosInmuebles = r2(sum(db.inmuebles, function (i) { return sum(i.costos, function (c) { return num(c.montoDOP); }); }));
 var valorFlotaRentCar = r2(sum(db.rentcarFlota || [], function (v) { return num(v.valorDOP); }));

 var operativoMes = r2(interesMes + moraMes);
 var flujoRecurrente = r2(operativoMes + igualasMes + rentasMes + rentCarIngMes);
 var dscr = servicioDeudaMes > 0 ? Math.round(flujoRecurrente / servicioDeudaMes * 100) : 0;
 var excedente = r2(flujoRecurrente - servicioDeudaMes);
 var tope = r2(num(db.config.topeSupervivenciaDOP) * factor);
 var fondo = num(db.config.fondoEmergenciaDOP);

 return {
 hoy: hoy, periodoLabel: periodLabel(), factorPeriodo: factor,
 carteraSaldoCapital: saldoCapital, capitalColocado: capitalColocado,
 carteraCount: activos.length, vencidoTotal: vencido, moraTotal: mora,
 moraCount: enMora.length, promesasCount: promesas.length, promesasVencidas: promesasVencidas.length,
 interesMes: interesMes, moraMes: moraMes, capitalRecuperadoMes: capitalRecuperadoMes,
 ingMes: ingMes, egrMes: egrMes, dgiiMes: dgiiMes, netoMes: r2(ingMes - egrMes),
 liquidez: liquidezTotal(), deudaTotal: deudaTotal,
 servicioDeudaMes: servicioDeudaMes, servicioDeudaBaseMes: servicioDeudaBaseMes,
 igualasMes: igualasMes, rentasMes: rentasMes, rentCarIngMes: rentCarIngMes,
 flujoRecurrente: flujoRecurrente,
 dscr: dscr, excedente: excedente, tope: tope, fondo: fondo,
 patrimonioInmuebles: patrimonioInmuebles, costosInmuebles: costosInmuebles,
 valorFlotaRentCar: valorFlotaRentCar,
 tercerosCustodia: tercerosCustodia,
 coberturaTope: tope > 0 ? Math.round(excedente / tope * 100) : 0
 };
 }

 /* ============================================================

 ============================================================ */

 function agendaDia(fecha) {
 fecha = fecha || todayISO();
 var hoy = todayISO();
 var items = [];
 var d = dayOf(fecha);

 db.prestamos.forEach(function (p) {
 p.cuotas.forEach(function (c) {
 if (cuotaPagada(c)) return;
 if (c.fecha === fecha) {
 items.push({
 tipo: 'Cuota', clase: 'cobro', deudor: p.deudor, deudorId: p.deudorId, refId: p.id, cuotaN: c.n,
 detalle: 'Cuota ' + c.n + ' de ' + p.cuotas.length + ' · ' + p.frecuencia,
 monto: r2(cuotaPendiente(c) + moraPendiente(c, fecha)),
 mora: moraPendiente(c, fecha), vence: c.fecha, estado: cuotaEstado(c, fecha)
 });
 } else if (c.fecha < fecha && c.fecha < hoy && fecha === hoy) {
 items.push({
 tipo: 'Atraso', clase: 'cobro', deudor: p.deudor, deudorId: p.deudorId, refId: p.id, cuotaN: c.n,
 detalle: 'Cuota ' + c.n + ' vencida el ' + fmtDate(c.fecha) + ' (' + daysBetween(c.fecha, hoy) + ' días)',
 monto: r2(cuotaPendiente(c) + moraPendiente(c, fecha)),
 mora: moraPendiente(c, fecha), vence: c.fecha, estado: cuotaEstado(c, fecha), atraso: true
 });
 }
 });
 });

 db.promesas.forEach(function (pr) {
 if (pr.estado !== 'Pendiente') return;
 if (pr.fechaCompromiso === fecha) {
 items.push({
 tipo: 'Promesa', clase: 'cobro', deudor: pr.deudor, refId: pr.prestamoId, promesaId: pr.id,
 detalle: 'Promesa de pago' + (pr.hora ? ' · ' + pr.hora : '') + (pr.notas ? ' · ' + pr.notas : ''),
 monto: num(pr.montoDOP), vence: pr.fechaCompromiso, estado: 'Pendiente'
 });
 }
 });

 db.igualas.forEach(function (ig) {
 if (num(ig.diaFacturacion) === d && ig.estado === 'Activa') {
 items.push({
 tipo: 'Iguala', clase: 'cobro', deudor: ig.cliente, refId: ig.id, detalle: ig.servicio,

 });
 }
 });

 db.alquileres.forEach(function (al) {
 if (num(al.diaCobro) === d && al.estado === 'Activa') {
 items.push({
 tipo: 'Renta', clase: 'cobro', deudor: al.inquilino, refId: al.id,
 detalle: 'Renta ' + fmtDayMonth(fecha) + ' · ' + nombreInmueble(al.inmuebleId),
 monto: num(al.rentaDOP), estado: al.estado, vence: fecha
 });
 }
 });

 (db.rentcarContratos || []).forEach(function (rc) {
 if (rc.estado === 'Activo' && rc.fechaFin === fecha) {
 var saldoRc = r2(Math.max(0, num(rc.totalDOP) - num(rc.pagadoDOP)));
 items.push({
 tipo: 'Rent Car', clase: 'cobro', deudor: rc.cliente, refId: rc.id,
 detalle: 'Retorno vehículo ' + nombreVehiculoRentCar(rc.vehiculoId) + (saldoRc > 0 ? ' · Saldo ' + money(saldoRc) : ' · Pagado'),
 monto: saldoRc > 0 ? saldoRc : num(rc.totalDOP), estado: saldoRc > 0 ? 'Por Cobrar' : 'Retorno Hoy', vence: fecha
 });
 }
 });

 db.pasivos.forEach(function (ps) {
 if (num(ps.diaPago) === d && num(ps.cuotaDOP) > 0) {
 items.push({
 tipo: 'Banco', clase: 'pago', deudor: ps.acreedor, refId: ps.id, detalle: ps.tipo + ' · ' + pct(ps.tasaAnualPct) + ' anual',
 monto: num(ps.cuotaDOP), estado: 'Programado', vence: fecha
 });
 }
 });

 var cobros = items.filter(function (i) { return i.clase === 'cobro'; });
 var pagos = items.filter(function (i) { return i.clase === 'pago'; });
 return {
 fecha: fecha, items: items, cobros: cobros, pagos: pagos,
 totalCobro: r2(sum(cobros, function (i) { return i.monto; })),

 };

 return { costos: inmuebleCostoTotal(i), comision: comision, neto: r2(comision - inmuebleCostoTotal(i)) };

 function tramiteSaldo(t) { return r2(Math.max(0, num(t.montoTotalDOP) - num(t.avanceDOP))); }
 function cajaChicaStats() {
 var fondo = num(db.config.cajaChicaFondoDOP) || 15000;
 var gastado = r2(sum(db.cajaGastos, function (g) { return num(g.montoDOP); }));
 return { fondo: fondo, gastado: gastado, disponible: r2(fondo - gastado) };
 }

 function getNotifState() {
 try {
 var raw = localStorage.getItem(NOTIF_STATE_KEY);
 var parsed = raw ? JSON.parse(raw) : null;
 if (parsed && typeof parsed === 'object') {
 parsed.read = parsed.read || {};
 parsed.dismissed = parsed.dismissed || {};
 return parsed;
 }
 } catch (e) {}
 return { read: {}, dismissed: {} };
 }
 function saveNotifState(st) {
 try { localStorage.setItem(NOTIF_STATE_KEY, JSON.stringify(st)); } catch (e) {}
 }

 function getNotificacionesActivas(includeDismissed) {
 var hoy = todayISO();
 var nState = getNotifState();
 var list = [];

 db.prestamos.forEach(function (p) {
 if (estadoPrestamo(p, hoy) === 'Liquidado') return;
 var dias = atrasoDiasP(p, hoy);
 var venc = vencidoP(p, hoy);
 if (dias > 0 && venc > 0) {
 list.push({
 id: 'MORA-' + p.id,
 categoria: dias > 30 ? 'Mora Crítica' : 'Cuota Vencida',
 nivel: dias > 30 ? 'red' : 'amber',

 tipoAccion: 'mora'
 });
 }
 });

 var agHoy = agendaDia(hoy);
 agHoy.cobros.filter(function (c) { return !c.atraso && c.tipo !== 'Promesa'; }).forEach(function (c, idx) {
 list.push({
 id: 'HOY-' + (c.refId || idx) + '-' + hoy,
 categoria: 'Vence Hoy',
 nivel: 'sky',
 titulo: c.deudor + ' · ' + c.tipo,
 detalle: c.detalle,
 monto: c.monto,
 refId: c.refId,
 subTipo: c.tipo,
 tipoAccion: 'ruta_hoy'
 });
 });

 db.promesas.forEach(function (pr) {
 if (pr.estado === 'Cumplida' || pr.estado === 'Cancelada') return;
 if (pr.fechaCompromiso <= hoy) {
 var inc = pr.fechaCompromiso < hoy || pr.estado === 'Incumplida';
 list.push({
 id: 'PRM-' + pr.id,
 categoria: inc ? 'Promesa Incumplida' : 'Promesa Hoy',
 nivel: inc ? 'red' : 'amber',
 titulo: pr.deudor + ' · ' + fmtDate(pr.fechaCompromiso),
 detalle: (pr.hora ? 'Hora ' + pr.hora + ' · ' : '') + (pr.notas || 'Compromiso de pago'),
 monto: num(pr.montoDOP),
 prestamoId: pr.prestamoId,
 promesaId: pr.id,
 tipoAccion: 'promesa'
 });
 }
 });

 db.pasivos.filter(function (ps) {
 return ps.tipo === 'Tarjeta de Crédito' || ps.tipo === 'Línea en Cuotas';
 }).forEach(function (t) {
 if (t.diaCorte) {
 var fCorte = proximaFechaDia(t.diaCorte);
 var dCorte = daysBetween(hoy, fCorte);
 if (dCorte >= 0 && dCorte <= 5) {
 list.push({
 id: 'TCC-' + t.id + '-' + fCorte,
 categoria: 'Corte TC ≤ 5d',
 nivel: 'violet',
 titulo: t.acreedor + ' · Corte ' + (dCorte === 0 ? 'hoy' : 'en ' + dCorte + ' día(s)'),
 detalle: 'Fecha de corte ' + fmtDate(fCorte) + ' · Usado ' + money(t.usadoDOP),
 monto: num(t.saldoDOP),
 pasivoId: t.id,
 tipoAccion: 'pasivo'
 });
 }
 }
 if (t.diaPago) {
 var fPago = proximaFechaDia(t.diaPago);
 var dPago = daysBetween(hoy, fPago);
 if (dPago >= 0 && dPago <= 5) {
 list.push({
 id: 'TCP-' + t.id + '-' + fPago,
 categoria: 'Pago TC ≤ 5d',
 nivel: 'red',
 titulo: t.acreedor + ' · Pago límite ' + (dPago === 0 ? 'hoy' : 'en ' + dPago + ' día(s)'),
 detalle: 'Fecha límite ' + fmtDate(fPago) + ' · Saldo ' + money(t.saldoDOP),
 monto: num(t.cuotaDOP || t.saldoDOP),
 pasivoId: t.id,
 tipoAccion: 'pasivo'
 });
 }
 }
 });

 var cc = cajaChicaStats();
 if (cc.fondo > 0 && cc.disponible < cc.fondo * 0.25) {
 list.push({
 id: 'CCH-LOW',
 categoria: 'Caja Chica Baja',
 nivel: 'amber',
 titulo: 'Caja Chica al ' + Math.round((cc.disponible / cc.fondo) * 100) + '% del fondo',
 detalle: 'Disponible ' + money(cc.disponible) + ' de ' + money(cc.fondo) + ' · Requiere reposición',
 monto: cc.disponible,
 tipoAccion: 'caja_chica'
 });
 }

 getNcfSequences().forEach(function (seq) {
 var disp = Math.max(0, num(seq.hasta) - num(seq.actual));
 if (seq.activo !== false && disp <= 15) {
 list.push({
 id: 'NCF-LOW-' + seq.tipo,
 categoria: 'NCF DGII Bajo',
 nivel: disp <= 5 ? 'red' : 'amber',
 titulo: 'Secuencia ' + seq.nombre + ' por agotarse',
 detalle: 'Quedan ' + disp + ' comprobantes disponibles (actual ' + seq.actual + ' de ' + seq.hasta + ')',
 monto: disp,
 esConteo: true,
 tipoAccion: 'ncf'
 });
 }
 });

 if (!cloud || !cloud.enabled || cloud.status !== 'online' || !cloud.lastSync || (!cloud.token && !cloud.email)) {
  list.unshift({
   id: 'NOTIF-SUPABASE-SYNC',
   nivel: 'red',
   categoria: 'Nube · Supabase Pendiente',
   titulo: 'Conexión y actualización con Supabase requerida',
   detalle: 'El sistema no está conectado ni actualizado con Supabase. Ingresa tu correo y contraseña para sincronizar ahora.',
   monto: 0,
   esTextoMonto: 'Iniciar sesión',
   tipoAccion: 'supabase_auth'
  });
 }

 return list.filter(function (n) {
 n.leida = !!nState.read[n.id];
 return includeDismissed ? true : !nState.dismissed[n.id];
 });
 }

 /* Persistencia Híbrida IndexedDB + localStorage */
 var AltioraIDB = (function () {
  var dbName = 'AltioraCoreIDB_v68';
  var storeName = 'kv';
  function openDB() {
   return new Promise(function (resolve, reject) {
    if (typeof indexedDB === 'undefined') return resolve(null);
    try {
     var req = indexedDB.open(dbName, 1);
     req.onupgradeneeded = function (e) {
      var idb = e.target.result;
      if (!idb.objectStoreNames.contains(storeName)) idb.createObjectStore(storeName);
     };
     req.onsuccess = function (e) { resolve(e.target.result); };
     req.onerror = function () { resolve(null); };
    } catch (err) { resolve(null); }
   });
  }
  return {
   set: function (key, valObj) {
    openDB().then(function (idb) {
     if (!idb) return;
     try {
      var tx = idb.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(valObj, key);
     } catch (e) {}
    });
   },
   get: function (key) {
    return openDB().then(function (idb) {
     if (!idb) return null;
     return new Promise(function (resolve) {
      try {
       var tx = idb.transaction(storeName, 'readonly');
       var r = tx.objectStore(storeName).get(key);
       r.onsuccess = function () { resolve(r.result || null); };
       r.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
     });
    });
   }
  };
 })();

 /* Fusión inteligente de estados Local + Supabase sin perder cobros offline */
 function mergeDbStates(localDb, remoteDb) {
  if (!remoteDb) return normalizeDb(localDb);
  if (!localDb) return normalizeDb(remoteDb);
  var merged = JSON.parse(JSON.stringify(remoteDb));
  var mergeArrById = function (locArr, remArr) {
   var map = {};
   var out = [];
   (remArr || []).forEach(function (item) {
    if (item && item.id) { map[item.id] = item; out.push(item); }
   });
   (locArr || []).forEach(function (item) {
    if (!item || !item.id) return;
    if (!map[item.id]) {
     out.unshift(item);
     map[item.id] = item;
    } else if (item.anuladoEn && !map[item.id].anuladoEn) {
     map[item.id] = item;
    }
   });
   return out;
  };
  merged.recibos = mergeArrById(localDb.recibos, remoteDb.recibos);
  merged.movimientos = mergeArrById(localDb.movimientos, remoteDb.movimientos);
  merged.promesas = mergeArrById(localDb.promesas, remoteDb.promesas);
  merged.deudores = mergeArrById(localDb.deudores, remoteDb.deudores);
  merged.usuarios = mergeArrById(localDb.usuarios, remoteDb.usuarios);
  merged.auditoria = mergeArrById(localDb.auditoria, remoteDb.auditoria);
  merged.cuentas = mergeArrById(localDb.cuentas, remoteDb.cuentas);
  merged.pasivos = mergeArrById(localDb.pasivos, remoteDb.pasivos);
  merged.inmuebles = mergeArrById(localDb.inmuebles, remoteDb.inmuebles);
  merged.alquileres = mergeArrById(localDb.alquileres, remoteDb.alquileres);
  merged.igualas = mergeArrById(localDb.igualas, remoteDb.igualas);
  // Fusionar préstamos conservando el que tenga mayor avance de cobros aplicados en sus cuotas
  var pMap = {}, pOut = [];
  (remoteDb.prestamos || []).forEach(function (p) { if (p && p.id) { pMap[p.id] = p; pOut.push(p); } });
  (localDb.prestamos || []).forEach(function (p) {
   if (!p || !p.id) return;
   if (!pMap[p.id]) { pOut.push(p); pMap[p.id] = p; }
   else {
    var sumPag = function (ln) { return sum(ln.cuotas || [], function (c) { return num(c.pagadoCap) + num(c.pagadoInt) + num(c.moraPagada); }); };
    if (sumPag(p) > sumPag(pMap[p.id])) {
     var idx = pOut.indexOf(pMap[p.id]);
     if (idx >= 0) pOut[idx] = p;
     pMap[p.id] = p;
    }
   }
  });
  merged.prestamos = pOut;
  return normalizeDb(merged);
 }

 var _authPromptShownOnBoot = false;
 async function autoEnsureSupabaseSession(isBoot) {
  try {
   if (!cloud.url || (typeof LEGACY_SB_URLS !== 'undefined' && LEGACY_SB_URLS.indexOf(String(cloud.url).replace(/\/+$/, '')) >= 0)) {
    cloud.url = DEFAULT_SB_URL;
