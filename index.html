 saveMovimientoEdit: function (id) {
 var mv = db.movimientos.filter(function (m) { return m.id === id; })[0];
 if (!mv) return;
 var nuevoMonto = numVal('ed-monto');
 if (nuevoMonto <= 0) return toast('El monto debe ser mayor a cero.', 'err');
 var nuevaFecha = val('ed-fecha') || mv.fecha;
 var nuevaCuenta = val('ed-cuenta') || mv.cuentaId;
 var nuevoMetodo = val('ed-metodo') || mv.metodo;
 var nuevoTipo = val('ed-tipo') || mv.tipo;
 var nuevoFlujo = val('ed-flujo') || mv.flujo;
 var montoAnterior = num(mv.montoDOP);
 var antes = mv.concepto + ' · ' + money(mv.montoDOP);

 tomarSnapshot();

 // Si está ligado a un recibo, actualizar el recibo y recalcular cuotas del préstamo
 if (mv.reciboId) {
 var rec = db.recibos.filter(function (r) { return r.id === mv.reciboId; })[0];
 if (rec) {
 actualizarReciboYCuotas(rec, nuevoMonto, nuevaFecha, nuevaCuenta, nuevoMetodo, rec.nota);
 }
 } else if (mv.refType === 'pasivo' && mv.refId) {
 var ps = db.pasivos.filter(function (x) { return x.id === mv.refId; })[0];
 if (ps) {
 var diff = r2(nuevoMonto - montoAnterior);
 ps.saldoDOP = r2(Math.max(0, num(ps.saldoDOP) - diff));
 ps.usadoDOP = r2(Math.min(num(ps.limiteDOP) || ps.saldoDOP, ps.saldoDOP));
 }
 } else if (mv.refType === 'tramite' && mv.refId) {
 var tr = db.tramites.filter(function (x) { return x.id === mv.refId; })[0];
 if (tr) {
 var diffTr = r2(nuevoMonto - montoAnterior);
 if (/impuesto/i.test(mv.categoria || '')) tr.impuestosPagadosDOP = r2(Math.max(0, num(tr.impuestosPagadosDOP) + diffTr));
 else tr.avanceDOP = r2(Math.max(0, num(tr.avanceDOP) + diffTr));
 }
 } else if (mv.refType === 'caja' && mv.refId) {
 var cg = db.cajaGastos.filter(function (g) { return g.id === mv.refId; })[0];
 if (cg) {
 cg.montoDOP = r2(nuevoMonto);
 cg.fecha = nuevaFecha;
 }
 }

 mv.fecha = nuevaFecha;
 mv.tipo = nuevoTipo;
 mv.montoDOP = r2(nuevoMonto);
 mv.cuentaId = nuevaCuenta;
 mv.flujo = nuevoFlujo;
 mv.metodo = nuevoMetodo;
 mv.categoria = val('ed-categoria') || mv.categoria;
 mv.concepto = val('ed-concepto') || mv.concepto;

 function normalizaTexto(s) {
 return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
 }

 function buscarTodo(q) {
 var t = normalizaTexto(q).trim();
 if (t.length < 2) return null;
 var res = { deudores: [], prestamos: [], recibos: [], movimientos: [], inmuebles: [], igualas: [], tramites: [], pasivos: [] };
 var hit = function (txt) { return normalizaTexto(txt).indexOf(t) >= 0; };

 db.deudores.forEach(function (d) {
 if (hit(d.nombre + ' ' + d.cedula + ' ' + d.tel + ' ' + d.ocupacion)) res.deudores.push(d);
 });
 db.prestamos.forEach(function (p) {
 if (hit(p.id + ' ' + p.deudor + ' ' + p.garantia + ' ' + (p.categoria || '') + ' ' + (p.garantiaRef || ''))) res.prestamos.push(p);
 });
 db.recibos.forEach(function (r) {
 if (r.estado !== 'Anulado' && hit(r.id + ' ' + r.deudor + ' ' + r.prestamoId)) res.recibos.push(r);
 });
 if (state.role === 'admin') {
 db.movimientos.forEach(function (m) {
 if (m.estado !== 'Anulado' && hit(m.concepto + ' ' + m.categoria + ' ' + m.metodo)) res.movimientos.push(m);
 });
 db.inmuebles.forEach(function (i) { if (hit(i.nombre + ' ' + i.zona + ' ' + i.propietario)) res.inmuebles.push(i); });
 db.igualas.forEach(function (g) { if (hit(g.cliente + ' ' + g.rnc + ' ' + g.servicio)) res.igualas.push(g); });
 db.tramites.forEach(function (x) { if (hit(x.cliente + ' ' + x.tipo + ' ' + x.rnc)) res.tramites.push(x); });
 db.pasivos.forEach(function (x) { if (hit(x.acreedor + ' ' + x.tipo + ' ' + x.destino)) res.pasivos.push(x); });
 }
 return res;
 }

 function saldoCuentaHasta(id, hastaISO) {
 var c = cuentaPorId(id);
 if (!c) return 0;
 var s = num(c.saldoInicialDOP != null ? c.saldoInicialDOP : c.saldoInicial);
 movsValidos().forEach(function (m) {
 if (m.fecha >= hastaISO) return;
 var v = num(m.montoDOP);
 if (m.tipo === 'Transferencia') {
 if (m.cuentaId === id) s -= v;
 if (m.cuentaDestinoId === id) s += v;
 } else if (m.cuentaId === id) {
 s += (m.tipo === 'Ingreso' ? v : -v);
 }
 });
 return r2(s);
 }

 function agrupaPorCategoria(movs) {
 var out = {};
 movs.forEach(function (m) {
 var k = m.categoria || 'Sin categoría';
 out[k] = r2((out[k] || 0) + num(m.montoDOP));
 });
 return out;
 }

 function tablaGrupo(obj, total) {
 var keys = Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; });
 if (!keys.length) return '<tr><td>Sin registros</td><td style="text-align:right">RD$ 0.00</td><td></td></tr>';
 return keys.map(function (k) {
 var pct = total ? Math.round(obj[k] / total * 100) : 0;
 return '<tr><td>' + esc(k) + '</td><td style="text-align:right">' + money(obj[k]) + '</td><td style="text-align:right">' + pct + '%</td></tr>';
 }).join('');
 }

 /* Calcula los datos consolidados del Reporte Gerencial Ejecutivo & Fiscal DGII */
 function calcReporteGerencialData() {
 var m = metrics();
 var pLbl = periodLabel();
 var movsPer = movsValidos().filter(function (x) { return inGlobalPeriod(x.fecha); });
 var recsPer = recibosValidos().filter(function (r) { return inGlobalPeriod(r.fecha); });

 // 1. Estado de Resultados Consolidado del Holding por unidad de negocio
 var ingInteresMora = r2(sum(recsPer, function (r) { return num(r.interesDOP) + num(r.moraDOP); }));
 var ingGastosCierre = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Ingreso' && /Cierre/i.test(x.categoria || ''); }), function (x) { return x.montoDOP; }));
 var ingIgualasTramites = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Ingreso' && (/Iguala|Trámite|Tramite|Honorario/i.test((x.categoria || '') + ' ' + (x.concepto || ''))); }), function (x) { return x.montoDOP; }));
 var ingComisionAlquiler = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Ingreso' && (/Alquiler|Renta/i.test(x.categoria || '')) && x.flujo !== 'Terceros'; }), function (x) { return x.montoDOP; }));
 var ingRentCar = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Ingreso' && (x.flujo === 'Holding / Rent Car' || /Rent Car|Castillo Rent/i.test((x.categoria || '') + ' ' + (x.concepto || ''))); }), function (x) { return x.montoDOP; }));
 var otrosIngresosOp = r2(sum(movsPer.filter(function (x) {
 if (x.tipo !== 'Ingreso' || x.flujo === 'Terceros' || x.flujo === 'Cobro de Cartera' || x.flujo === 'Capital') return false;
 var txt = (x.categoria || '') + ' ' + (x.concepto || '');
 if (/Cierre|Iguala|Trámite|Tramite|Honorario|Alquiler|Renta|Rent Car|Castillo Rent/i.test(txt) || x.flujo === 'Holding / Rent Car') return false;
 return true;
 }), function (x) { return x.montoDOP; }));

 var totalIngresosBrutos = r2(ingInteresMora + ingGastosCierre + ingIgualasTramites + ingComisionAlquiler + ingRentCar + otrosIngresosOp);

 var gastosOperativos = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Egreso' && (x.flujo === 'Gasto Fijo' || x.flujo === 'Operativo'); }), function (x) { return x.montoDOP; }));
 var servicioDeudaPagado = r2(sum(movsPer.filter(function (x) { return x.tipo === 'Egreso' && x.flujo === 'Servicio de Deuda'; }), function (x) { return x.montoDOP; }));
 var impuestoDgii020 = r2(sum(movsPer, function (x) { return num(x.dgiiDOP); }));
 var totalEgresosConsolidados = r2(gastosOperativos + servicioDeudaPagado + impuestoDgii020);
 var utilidadNetaPeriodo = r2(totalIngresosBrutos - totalEgresosConsolidados);

 // 2. KPIs Gerenciales
 var roiCartera = m.capitalColocado > 0 ? r2((ingInteresMora / m.capitalColocado) * 100) : 0;
 var exigibleTotal = r2(m.interesMes + m.moraMes + m.capitalRecuperadoMes + m.vencidoTotal);
 var tasaRecuperacion = exigibleTotal > 0 ? r2(((m.interesMes + m.moraMes + m.capitalRecuperadoMes) / exigibleTotal) * 100) : 100;
 var saldoEnRiesgo = r2(sum(db.prestamos.filter(function (p) { return estadoPrestamo(p) !== 'Liquidado' && atrasoDiasP(p) > 0; }), saldoCapitalP));
 var parIndice = m.carteraSaldoCapital > 0 ? r2((saldoEnRiesgo / m.carteraSaldoCapital) * 100) : 0;
 var liquidezNetaPropia = r2(m.liquidez - m.tercerosCustodia);

 // 3. Rendimiento por Segmento de Cartera
 var segmentos = CATEGORIAS_CARTERA.map(function (cat) {
 var ps = db.prestamos.filter(function (p) { return (p.categoria || 'Consumo / Personal') === cat; });
 var activos = ps.filter(function (p) { return estadoPrestamo(p) !== 'Liquidado'; });
 var ids = ps.map(function (p) { return p.id; });
 var recsSeg = recsPer.filter(function (r) { return ids.indexOf(r.prestamoId) >= 0; });
 return {
 categoria: cat,
 cantidad: activos.length,
 capitalColocado: r2(sum(activos, function (p) { return p.capitalDOP; })),
 saldoActivo: r2(sum(activos, saldoCapitalP)),
 interesGenerado: r2(sum(recsSeg, function (r) { return num(r.interesDOP); })),
 moraSegmento: r2(sum(activos, function (p) { return moraTotalP(p); }))
 };
 });

 // 4. Pre-Liquidación Fiscal DGII (606 / 607 / 0.20%)
 var baseFacturada607 = r2(ingIgualasTramites + ingComisionAlquiler + ingGastosCierre);
 var itbisFacturado18 = r2(baseFacturada607 * (num(db.config.itbisPct || 18) / 100));
 var retencionIsr10 = r2(baseFacturada607 * (num(db.config.isrRetPct || 10) / 100));
 var comprasGastos606 = r2(gastosOperativos + sum(db.inmuebles, function (i) {
 return sum((i.costos || []).filter(function (c) { return inGlobalPeriod(c.fecha); }), function (c) { return c.montoDOP; });
 }));
 var itbisAdelantado606 = r2(comprasGastos606 * 0.18);

 return {
 periodo: pLbl,
 ingInteresMora: ingInteresMora,
 ingGastosCierre: ingGastosCierre,
 ingIgualasTramites: ingIgualasTramites,
 ingComisionAlquiler: ingComisionAlquiler,
 ingRentCar: ingRentCar,
 otrosIngresosOp: otrosIngresosOp,
 totalIngresosBrutos: totalIngresosBrutos,
 gastosOperativos: gastosOperativos,
 servicioDeudaPagado: servicioDeudaPagado,
 impuestoDgii020: impuestoDgii020,
 totalEgresosConsolidados: totalEgresosConsolidados,
 utilidadNetaPeriodo: utilidadNetaPeriodo,
 capitalRecuperado: m.capitalRecuperadoMes,
 roiCartera: roiCartera,
 tasaRecuperacion: tasaRecuperacion,
 parIndice: parIndice,
 dscr: m.dscr,
 liquidezBruta: m.liquidez,
 tercerosCustodia: m.tercerosCustodia,
 liquidezNetaPropia: liquidezNetaPropia,
 segmentos: segmentos,
 baseFacturada607: baseFacturada607,
 itbisFacturado18: itbisFacturado18,
 retencionIsr10: retencionIsr10,
 comprasGastos606: comprasGastos606,
 itbisAdelantado606: itbisAdelantado606
 };
 }

 function descargarCSV(filas, nombre) {
 var csv = filas.map(function (f) {
 return f.map(function (c) {
 var s = String(c == null ? '' : c).replace(/"/g, '""');
 return /[;"\n]/.test(s) ? '"' + s + '"' : s;
 }).join(';');
 }).join('\r\n');
 var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
 var a = document.createElement('a');

 a.download = nombre;
 a.click();
 toast('Archivo generado: ' + nombre, 'ok');
 }

 var cta = val('renta-cuenta');
 registrarMovimiento({
 fecha: todayISO(), cuentaId: cta, tipo: 'Ingreso', flujo: 'Operativo', categoria: 'Comisión Alquiler',
 concepto: 'Comisión administración renta · ' + a.inquilino, monto: com, metodo: 'Transferencia', refType: 'alquiler', refId: a.id
 });
 if (terceros > 0) {
 registrarMovimiento({
 fecha: todayISO(), cuentaId: cta, tipo: 'Ingreso', flujo: 'Terceros', categoria: 'Renta Propietario',
 concepto: 'Renta para propietario · ' + nombreInmueble(a.inmuebleId), monto: terceros, metodo: 'Transferencia', refType: 'alquiler', refId: a.id
 });
 }
 a.ultimoCobro = todayISO();
 a.estado = 'Activa';
 a.historial.unshift({ fecha: todayISO(), monto: r2(monto), comision: com, propietario: terceros });
 save(); closeModal();
 toast('Renta cobrada: comisión ' + money(com) + ' · propietario ' + money(terceros), 'ok');
 },

 <button class="btn btn-outline btn-sm" onclick="App.closeModal()">&times;</button></div>
 <div class="modal-body stack">
 <div class="field"><label class="label">Concepto *</label><input class="input" id="cch-concepto" placeholder="Ej: Papelería, combustible, limpieza"></div>
 <div class="grid g2">
 <div class="field"><label class="label">Monto (RD$)</label><input class="input" id="cch-monto" type="number" step="0.01"></div>
 <div class="field"><label class="label">Responsable</label><input class="input" id="cch-resp" value="Oficina"></div>
 </div>
 <div class="field"><label class="label">Fecha</label><input class="input" id="cch-fecha" type="date" value="${todayISO()}"></div>
 </div>
 <div class="modal-foot">
 <button class="btn btn-outline" onclick="App.closeModal()">Cancelar</button>
 <button class="btn btn-primary" onclick="App.saveCajaGasto()">Registrar gasto</button>
 </div>
 </div></div>`);
 },

 eliminarTarea: function (id) {
 var t = db.tareas.filter(function (x) { return x.id === id; })[0];
 if (!t) return;
 tomarSnapshot();
 db.tareas = db.tareas.filter(function (x) { return x.id !== id; });
 save(); toastUndo('Tarea eliminada.');
 },

 eliminarCajaGasto: function (id) {
 var g = db.cajaGastos.filter(function (x) { return x.id === id; })[0];
 if (!g) return;
 tomarSnapshot();
 db.cajaGastos = db.cajaGastos.filter(function (x) { return x.id !== id; });
 db.movimientos = db.movimientos.filter(function (m) { return !(m.refType === 'caja' && m.refId === id); });
 save(); toastUndo('Gasto de caja chica eliminado y fondo restituido.');
 },

 reponerCajaChica: function () {
 var cc = cajaChicaStats();
 if (cc.gastado <= 0) return toast('La caja chica está al 100% de su fondo fijo.', 'ok');
 var ctaCaja = db.cuentas.filter(function (c) { return c.tipo === 'Caja Chica'; })[0];
 var ctaBanco = db.cuentas.filter(function (c) { return c.tipo === 'Banco' && c.activo !== false; })[0] || db.cuentas[0];
 openModal(`<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()"><div class="modal-card sm">
 <div class="modal-head"><div><h3>Reponer fondo de Caja Chica</h3><p>Gastado actual: ${money(cc.gastado)} · Disponible: ${money(cc.disponible)}</p></div>
 <button class="btn btn-outline btn-sm" onclick="App.closeModal()">&times;</button></div>
 <div class="modal-body stack">
 <div class="callout">Se transferirá el monto de reposición desde la cuenta seleccionada hacia <b>${esc(ctaCaja ? ctaCaja.nombre : 'Caja Chica')}</b> y se reiniciará el ciclo de comprobantes menores.</div>
 <div class="grid g2">
 <div class="field"><label class="label">Desde la cuenta</label><select class="select" id="rep-cc-origen">${cuentaOptions(ctaBanco ? ctaBanco.id : '')}</select></div>
 <div class="field"><label class="label">Monto a reponer (RD$)</label><input class="input" id="rep-cc-monto" type="number" step="0.01" value="${cc.gastado.toFixed(2)}"></div>
 </div>
 </div>
 <div class="modal-foot">
 <button class="btn btn-outline" onclick="App.closeModal()">Cancelar</button>
 <button class="btn btn-primary" onclick="App.confirmarReponerCajaChica()">Reponer caja chica</button>
 </div>
 </div></div>`);
 },

 confirmarReponerCajaChica: function () {
 var origen = val('rep-cc-origen');
 var monto = numVal('rep-cc-monto');
 if (monto <= 0) return toast('Indica un monto válido.', 'err');
 var ctaCaja = db.cuentas.filter(function (c) { return c.tipo === 'Caja Chica'; })[0];
 tomarSnapshot();
 if (ctaCaja && origen && origen !== ctaCaja.id) {
 registrarMovimiento({
 fecha: todayISO(), cuentaId: origen, cuentaDestinoId: ctaCaja.id, tipo: 'Transferencia',
 flujo: 'Transferencia', categoria: 'Reposición Caja Chica', concepto: 'Reposición de fondo de caja chica',
 monto: monto, metodo: 'Transferencia'
 });
 }
 db.cajaGastos = [];
 auditoriaRegistrar('REPOSICIÓN CAJA CHICA', 'Fondo repuesto por ' + money(monto) + ' desde ' + nombreCuenta(origen), 'caja', '');
 save(); closeModal(); toastUndo('Fondo de caja chica repuesto al 100%.');
 },

 saveCajaGasto: function () {
 var concepto = val('cch-concepto').trim(), monto = numVal('cch-monto');
 if (!concepto || monto <= 0) return toast('Indica concepto y monto.', 'err');
 var cc = cajaChicaStats();
 if (monto > cc.disponible + 0.01 && !confirm('El gasto excede el disponible de caja chica. ¿Registrar igual?')) return;
 var gId = uid('CCH');
 db.cajaGastos.unshift({
 id: gId, fecha: val('cch-fecha') || todayISO(), concepto: concepto,
 montoDOP: r2(monto), responsable: val('cch-resp')
 });
 var cta = db.cuentas.filter(function (c) { return c.tipo === 'Caja Chica'; })[0];
 if (cta) {
 registrarMovimiento({
 fecha: val('cch-fecha') || todayISO(), cuentaId: cta.id, tipo: 'Egreso', flujo: 'Gasto Fijo',
 categoria: 'Caja Chica', concepto: 'Caja chica · ' + concepto, monto: monto, metodo: 'Efectivo',
 refType: 'caja', refId: gId
 });
 }
 save(); closeModal(); toast('Gasto de caja chica registrado.', 'ok');
 }
 });

 /* ============================================================
 32 · AJUSTES, NUBE E INSTALACIÓN
 ============================================================ */

 Object.assign(root.App, {
 saveConfig: function () {
 var set = function (id, fn) { var e = el(id); if (e) fn(e); };
 set('cfg-tope', function (e) { db.config.topeSupervivenciaDOP = num(e.value); });
 set('cfg-fe', function (e) { db.config.fondoEmergenciaDOP = num(e.value); });
 set('cfg-cc', function (e) { db.config.cajaChicaFondoDOP = num(e.value); });
 set('cfg-dgii', function (e) { db.config.dgiiPct = num(e.value); });
 set('cfg-tel', function (e) { db.config.tel = e.value.trim(); });
 set('cfg-titular', function (e) { db.config.titular = e.value.trim() || 'Elmer'; });
 if (el('cfg-mora-modo')) {
 db.config.mora = {
 modo: val('cfg-mora-modo'), valor: numVal('cfg-mora-valor'),
 diasGracia: numVal('cfg-mora-gracia'), prorrateoDiario: true
 };
 }
 save(); toast('Parámetros guardados.', 'ok');
 },

 exportJSON: function () {
 var blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
 var a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'Altiora_Core_v6.2_' + todayISO() + '.json';
 a.click();
 toast('Respaldo descargado.', 'ok');
 },

 resetData: function () {
 if (!confirm('¿Restaurar la base de demostración? Se perderá lo que hayas registrado.')) return;
 db = seedDB();
 save(); toast('Base restaurada.', 'ok');
 },

 importJSON: function (input) {
 var f = input && input.files && input.files[0];
 if (!f) return;
 var reader = new FileReader();
 reader.onload = function () {
 try {
 var data = JSON.parse(reader.result);
 if (!data || typeof data !== 'object') throw new Error('estructura no reconocida');
 db = normalizeDb(data);
 save();
 toast('Respaldo importado: ' + db.prestamos.length + ' préstamos, ' + db.deudores.length + ' deudores, ' + db.recibos.length + ' recibos.', 'ok');
 } catch (e) {
 toast('Archivo inválido: ' + e.message, 'err');
 }
 };
 reader.onerror = function () { toast('No se pudo leer el archivo.', 'err'); };
 reader.readAsText(f);
 },

 restaurarRespaldo: function () {
 var raw = null;
 try { raw = localStorage.getItem(STORAGE_KEY + '_bak'); } catch (e) { }
 if (!raw) return toast('Todavía no hay un respaldo automático guardado.', 'err');
 if (!confirm('¿Restaurar el estado anterior a la última modificación?')) return;
 if (typeof tomarSnapshot === 'function') tomarSnapshot();
 try {
 db = normalizeDb(JSON.parse(raw));
 save();
 toast('Respaldo anterior restaurado.', 'ok');
 } catch (e) { toast('El respaldo está dañado: ' + e.message, 'err'); }
 },

 connectSupabase: async function () {
 cloud.url = val('sb-url').trim() || DEFAULT_SB_URL;
 cloud.key = val('sb-key').trim() || DEFAULT_SB_KEY;
 cloud.enabled = true;
 cloud.manualDisconnect = false;
 var email = val('sb-email').trim(), pass = val('sb-pass');
 if (email && pass) {
 try { await loginSupabase(email, pass); }
 catch (e) { toast('Error conectando: ' + e.message, 'err'); }
 } else {
 saveCloudCfg();
 await pullFromSupabase(false);
 }
 },
 syncNow: function () { pullFromSupabase(false); },
 forcePush: function () { pushToSupabase(false); },
 disconnectSupabase: function () {
 cloud.enabled = false; cloud.manualDisconnect = true; cloud.token = ''; cloud.status = 'local';
 saveCloudCfg(); render(); toast('Desconectado de la nube.', 'ok');
 },
 installPWA: function () {
 if (!deferredPrompt) return;
 deferredPrompt.prompt();
 deferredPrompt.userChoice.then(function () {
 deferredPrompt = null;
 var b = el('btn-pwa-install'); if (b) b.hidden = true;
 });
 }
 });

 /* ============================================================
 33 · EVENTOS E INICIALIZACIÓN (INCLUYE ENTER EN MODALES Y OFFLINE ➔ ONLINE)
 ============================================================ */

 var nav = el('nav');
 if (nav) {
 nav.addEventListener('click', function (e) {
 var btn = e.target.closest('[data-tab]');
 if (!btn) return;
 state.tab = btn.getAttribute('data-tab');
 render();
 window.scrollTo({ top: 0, behavior: 'smooth' });
 });
 }

 var tasaInput = el('tasa-global');
 if (tasaInput) {
 tasaInput.addEventListener('change', function (e) {
 db.config.tasa = num(e.target.value) || 60;
 save();
 });
 }

 document.addEventListener('keydown', function (e) {
 if ((e.ctrlKey || e.metaKey) && e.shiftKey && String(e.key).toLowerCase() === 'd') {
 e.preventDefault();
 App.toggleTheme();
 return;
 }
 if (e.key === 'Escape') closeModal();
 if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
 e.preventDefault();
 if (typeof App.openBusqueda === 'function') App.openBusqueda();
 return;
 }
 if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.tagName !== 'TEXTAREA') {
 var modal = document.querySelector('#modal-root .modal-card');
 if (modal) {
 var primaryBtn = modal.querySelector('.modal-foot .btn-primary, .modal-foot .btn-success, .modal-foot .btn-danger');
 if (primaryBtn && !primaryBtn.disabled) {
 e.preventDefault();
 primaryBtn.click();
 return;
 }
 }
 }
 });

 window.addEventListener('beforeinstallprompt', function (e) {
 e.preventDefault();
 deferredPrompt = e;
 var b = el('btn-pwa-install');
 if (b) b.hidden = false;
 });

 if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
 navigator.serviceWorker.register('./sw.js').catch(function () { });
 }

 function handleHashShortcut() {
 var h = String(location.hash || '').replace(/^#/, '').toLowerCase();
 if (!h) return;
 if (h === 'cobro' || h === 'cobrar') {
 render();
 setTimeout(function () { App.openPaymentModal(); }, 60);
 } else if (['dashboard', 'ruta', 'deudores', 'cartera', 'cobros', 'promesas', 'bovedas', 'apalancamiento', 'bola', 'inmuebles', 'alquileres', 'igualas', 'supervision', 'documentos', 'nube'].indexOf(h) >= 0) {
 state.tab = h;
 render();
 }
 }
 window.addEventListener('hashchange', handleHashShortcut);

 window.addEventListener('online', function () {
 toast('Conexión restablecida. Sincronizando con Supabase…', 'ok');
 if (cloud.enabled && cloud.key) {
 if (cloud.pendingSync) pushToSupabase(true);
 else pullFromSupabase(true);
 }
 });
 window.addEventListener('offline', function () {
 cloud.status = 'offline';
 updateCloudIndicator();
 toast('Modo sin conexión activo: tus cambios se guardarán localmente y subirán al volver la red.', '');
 });

 applyTheme();
 load();
 applyTheme();
 render();
 handleHashShortcut();
 if (cloud.enabled && cloud.key) pullFromSupabase(true);

 /* Hook de diagnóstico: expone el motor puro para pruebas automáticas. */
 root.App._engine = {
 calcSchedule: calcSchedule, fechasCuotas: fechasCuotas, generarCuotas: generarCuotas,
 factorPeriodoFrecuencia: factorPeriodoFrecuencia,
 aplicarPago: aplicarPago, moraPendiente: moraPendiente, saldoCapitalP: saldoCapitalP,
 vencidoP: vencidoP, estadoPrestamo: estadoPrestamo, agendaDia: agendaDia,
 saldoCuenta: saldoCuenta, metrics: metrics, simularBolaNieve: simularBolaNieve,
 cuotaEstado: cuotaEstado, seed: seedDB, hoy: todayISO, db: function () { return db; },
 buildDocHtml: buildDocHtml, registrarCobro: registrarCobro,
 montoEnLetras: montoEnLetras, buildDocText: buildDocText,
 getNotificacionesActivas: getNotificacionesActivas,
 calcReporteGerencialData: calcReporteGerencialData
 };

})(typeof window !== 'undefined' ? window : globalThis);
</script>
