 root.App.openSociosCarteraModal = function () {
  var sociosMap = {};
  (db.prestamos || []).forEach(function (p) {
   if (p.socioNombre && num(p.socioPct) > 0) {
    var k = p.socioNombre.trim();
    if (!sociosMap[k]) sociosMap[k] = { nombre: k, prestamos: [], generadoDOP: 0, pagadoDOP: 0 };
    sociosMap[k].prestamos.push(p);
   }
  });
  recibosValidos().forEach(function (r) {
   var p = lnById(r.prestamoId);
   var sNom = r.socioNombre || (p && p.socioNombre) || '';
   var sPct = num(r.socioPct || (p && p.socioPct));
   if (sNom && sPct > 0) {
    var k = sNom.trim();
    if (!sociosMap[k]) sociosMap[k] = { nombre: k, prestamos: [], generadoDOP: 0, pagadoDOP: 0 };
    var part = num(r.socioMontoDOP) || r2(num(r.interesDOP) * (sPct / 100));
    sociosMap[k].generadoDOP = r2(sociosMap[k].generadoDOP + part);
   }
  });
  movsValidos().forEach(function (m) {
   if (m.categoria === 'Desembolso a Co-Inversionista' && m.socioNombre) {
    var k = m.socioNombre.trim();
    if (sociosMap[k]) sociosMap[k].pagadoDOP = r2(sociosMap[k].pagadoDOP + num(m.montoDOP));
   }
  });
  var listaSocios = Object.keys(sociosMap).map(function (k) {
   var s = sociosMap[k];
   s.pendienteDOP = r2(Math.max(0, s.generadoDOP - s.pagadoDOP));

  openModal(`<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()"><div class="modal-card lg">

     <select class="select" id="soc-cta-origen">${cuentaOptions(ctaDefault)}</select>
    </div>
    <div class="card"><div class="card-body tight table-wrap">
     <table class="table">
      <thead><tr><th>Socio / Co-Inversionista</th><th>Préstamos Vinculados</th><th class="num">Total Generado</th><th class="num">Desembolsado</th><th class="num">Pendiente por Pagar</th><th>Acciones</th></tr></thead>
      <tbody>${listaSocios.map(function (s) {
       return `<tr>
        <td class="strong">${esc(s.nombre)}</td>
        <td>${s.prestamos.map(function (p) { return `<span class="badge b-sky">${esc(p.id)} (${pct(p.socioPct)})</span>`; }).join(' ')}</td>
        <td class="num">${money(s.generadoDOP)}</td>

        <td class="num strong ${s.pendienteDOP > 0 ? 'neg' : ''}">${money(s.pendienteDOP)}</td>
        <td class="nowrap">
         ${s.pendienteDOP > 0 ? `<button class="btn btn-success btn-sm" onclick="App.desembolsarSocio('${esc(s.nombre)}', ${s.pendienteDOP})">💸 Pagar ${moneyShort(s.pendienteDOP)}</button>` : '<span class="mini pos">Al día ✓</span>'}
         <button class="btn btn-outline btn-sm" onclick="App.enviarEstadoSocioWA('${esc(s.nombre)}')">📲 WA Socio</button>

 /* Automatización mensual al iniciar el mes: pasar alquileres e igualas activos a 'Por Cobrar' si aún no tienen cobro este mes */
 function autoFacturacionMensual() {
  var mKey = currentMonthKey();
  if (db.config && db.config.ultimoMesFacturadoAuto === mKey) return;
  var cambios = 0;
  (db.alquileres || []).forEach(function (a) {
   if (a.estado === 'Activa' && (!a.ultimoCobro || monthKey(a.ultimoCobro) < mKey)) {
    a.estado = 'Por Cobrar';
    cambios++;
   }
  });
  (db.igualas || []).forEach(function (ig) {
   if (ig.estado === 'Activa' && (!ig.ultimoCobro || monthKey(ig.ultimoCobro) < mKey)) {
    ig.estado = 'Por Cobrar';
    cambios++;
   }
  });
  if (db.config) db.config.ultimoMesFacturadoAuto = mKey;
  if (cambios > 0) save(true);
 }

 /* ---------------- 7 · REINICIO DE LIQUIDEZ Y COBROS DEL MES EN CERO (CORTE LIMPIO) ---------------- */
 var RESET_LIQUIDEZ_MES_ID = 'RESET_LIQ_COBROS_' + currentMonthKey() + '_V1';

 function ejecutarCorteLiquidezYCobrosMesCero(targetDb) {
  var d = targetDb || db;
  if (!d) return false;
  var mKey = currentMonthKey();

  // 1. Revertir en las cuotas todos los recibos emitidos en el mes actual
  (d.recibos || []).forEach(function (r) {
   if (!r || !r.fecha || monthKey(r.fecha) !== mKey) return;
   var p = (d.prestamos || []).filter(function (x) { return x.id === r.prestamoId; })[0];
   if (!p) return;
   if (Array.isArray(r.cuotasSnapshot) && r.cuotasSnapshot.length) {
    p.cuotas = JSON.parse(JSON.stringify(r.cuotasSnapshot));
    if (p.estadoManual === 'Liquidado') p.estadoManual = '';
   } else if (Array.isArray(r.detalle)) {
    r.detalle.forEach(function (det) {
     var c = (p.cuotas || []).filter(function (x) { return x.n === det.n; })[0];
     if (!c) return;
     if (det.tipo === 'Mora') c.moraPagada = r2(Math.max(0, num(c.moraPagada) - num(det.monto)));
     else if (det.tipo === 'Interés') c.pagadoInt = r2(Math.max(0, num(c.pagadoInt) - num(det.monto)));
     else c.pagadoCap = r2(Math.max(0, num(c.pagadoCap) - num(det.monto)));
    });
    if (p.estadoManual === 'Liquidado') p.estadoManual = '';
   }
  });

  // 2. Asegurar que cualquier pago registrado este mes o en cuotas de este mes en adelante quede en cero
  (d.prestamos || []).forEach(function (p) {
   (p.cuotas || []).forEach(function (c) {
    if (Array.isArray(c.pagos) && c.pagos.length) {
     var pagosMes = c.pagos.filter(function (pg) { return pg && pg.fecha && monthKey(pg.fecha) === mKey; });
     if (pagosMes.length) {
      pagosMes.forEach(function (pg) {
       c.pagadoInt = r2(Math.max(0, num(c.pagadoInt) - num(pg.int)));
       c.pagadoCap = r2(Math.max(0, num(c.pagadoCap) - num(pg.cap)));
       c.moraPagada = r2(Math.max(0, num(c.moraPagada) - num(pg.mora)));
      });
      c.pagos = c.pagos.filter(function (pg) { return !pg || !pg.fecha || monthKey(pg.fecha) !== mKey; });
     }
    }
    if (c.fecha && monthKey(c.fecha) >= mKey && (num(c.pagadoInt) > 0 || num(c.pagadoCap) > 0 || num(c.moraPagada) > 0)) {
     c.pagadoInt = 0;
     c.pagadoCap = 0;
     c.moraPagada = 0;
     c.moraExonerada = 0;
     c.pagos = [];
     if (p.estadoManual === 'Liquidado') p.estadoManual = '';
    }
   });
   if (p.sistema === 'interes') recalcularInteresSobreSaldoInsoluto(p);
  });

  // 3. Eliminar todos los recibos del mes actual para que Cobros del Mes quede en RD$ 0.00
  d.recibos = (d.recibos || []).filter(function (r) {
   return !r || !r.fecha || monthKey(r.fecha) !== mKey;
  });

  // 4. Reiniciar cobros del mes en Alquileres e Igualas
  (d.alquileres || []).forEach(function (a) {
   if (a.ultimoCobro && monthKey(a.ultimoCobro) === mKey) a.ultimoCobro = '';
   if (Array.isArray(a.historial)) {
    a.historial = a.historial.filter(function (h) { return !h || !h.fecha || monthKey(h.fecha) !== mKey; });
   }
   if (a.estado !== 'Inactivo') a.estado = 'Por Cobrar';
  });
  (d.igualas || []).forEach(function (ig) {
   if (ig.ultimoCobro && monthKey(ig.ultimoCobro) === mKey) ig.ultimoCobro = '';
   if (ig.estado !== 'Inactiva') ig.estado = 'Por Cobrar';
  });

  // 5. Poner la Liquidez Total y todas las Bóvedas/Cuentas exactamente en RD$ 0.00
  d.movimientos = [];
  (d.cuentas || []).forEach(function (cta) {
   cta.saldoInicialDOP = 0;
   cta.saldoInicial = 0;
  });

  if (!d.config) d.config = {};
  d.config.resetLiquidezMesCeroId = RESET_LIQUIDEZ_MES_ID;
  try { localStorage.setItem('altiora_reset_liq_id', RESET_LIQUIDEZ_MES_ID); } catch (e) {}
  return true;
 }

 root.App.recalcCuadreBovedaPreview = function (cuentaId) {
  var box = el('cuadre-preview-box');
  if (!box) return;
  var lib = saldoCuenta(cuentaId);
  var real = numVal('cuadre-saldo-real');
  var diff = r2(real - lib);
  if (Math.abs(diff) < 0.01) {
   box.innerHTML = 'El saldo real coincide exactamente con el saldo en libros (Diferencia: <b>RD$ 0.00</b>).';
  } else if (diff > 0) {
   box.innerHTML = 'Diferencia detectada: <b class="pos">+' + money(diff) + ' a favor</b>. Se ajustará la cuenta para que quede exactamente en <b>' + money(real) + '</b>.';
  } else {
   box.innerHTML = 'Diferencia detectada: <b class="neg">' + money(diff) + ' en contra</b> (ej. cargo bancario o 0.15% DGII). Se ajustará la cuenta para que quede exactamente en <b>' + money(real) + '</b>.';
  }
 };

 root.App.aplicarCuadreBoveda = function (cuentaId) {
  var c = ctaById(cuentaId);
  if (!c) return;
  var lib = saldoCuenta(c.id);
  var real = numVal('cuadre-saldo-real');
  var diff = r2(real - lib);
  var motivo = val('cuadre-motivo') || 'Ajuste de Arqueo / Conciliación';
  tomarSnapshot();

  if (motivo === 'Fijar como nuevo Saldo Base Inicial' || Math.abs(diff) >= 0.01) {
   if (motivo === 'Fijar como nuevo Saldo Base Inicial') {
    var netoMovs = r2(lib - num(c.saldoInicialDOP != null ? c.saldoInicialDOP : c.saldoInicial));
    c.saldoInicialDOP = r2(real - netoMovs);
    c.saldoInicial = c.saldoInicialDOP;
   } else if (Math.abs(diff) >= 0.01) {
    registrarMovimiento({
     fecha: todayISO(),
     cuentaId: c.id,
     tipo: diff > 0 ? 'Ingreso' : 'Egreso',
     flujo: 'Operativo',
     categoria: motivo,
     concepto: motivo + ' · Cuadre de ' + c.nombre + ' (Libros: ' + money(lib) + ' ➔ Real: ' + money(real) + ')',
     monto: Math.abs(diff),
     metodo: 'Ajuste Contable'
    });
   }
  }
  auditoriaRegistrar('CUADRE DE BÓVEDA', c.nombre + ' cuadrada a ' + money(real) + ' (Dif: ' + money(diff) + ')', 'boveda', c.id);
  closeModal();
  save();
  toastUndo('✓ Cuenta ' + c.nombre + ' cuadrada exactamente en ' + money(real) + '.');
 };

  var p = lnById(state._workoutLoanId);

  var intInc = numVal('wk-int-cap');
  var moraInc = numVal('wk-mora-cap');
  var abono = numVal('wk-abono-ini');
  var nuevoCap = r2(Math.max(0, capBase + intInc + moraInc - abono));
  var sis = val('wk-sistema') || 'frances';
  var frec = val('wk-frec') || p.frecuencia;
  var plazo = Math.max(1, parseInt(val('wk-plazo'), 10) || 12);
  var tasa = sis === 'capital' ? 0 : numVal('wk-tasa');

  var sched = calcSchedule(nuevoCap, tasa, plazo, sis, frec, fecha, diasPagoDe(p));
  state._lastWorkoutPlan = { nuevoCap: nuevoCap, sis: sis, frec: frec, plazo: plazo, tasa: tasa, fecha: fecha, cuota: sched.cuotaPeriodo, rows: sched.rows };

  box.innerHTML = `

   <div class="kv"><span>Nueva Cuota Pactada (${plazo} cuotas · ${esc(frec)})</span><span class="strong pos" style="font-size:15px">${money(sched.cuotaPeriodo)}</span></div>

 /* ---------------- 4 · MAPA DE FLUJO DE CAJA DÍA POR DÍA A 14 DÍAS (DETECTOR DE BACHES) ---------------- */
 function calcularFlujo14Dias() {
  var hoy = todayISO();
  var saldoAcum = liquidezTotal();
  var dias = [];
  var minSaldo = saldoAcum;
  var fechaMin = hoy;

  for (var i = 0; i < 14; i++) {
   var f = isoAddDays(hoy, i);
   var dNum = parseISO(f).getDate();
   var entradas = 0, salidas = 0;
   var detIn = [], detOut = [];

   (db.prestamos || []).forEach(function (p) {
    if (estadoPrestamo(p, hoy) === 'Liquidado') return;
    (p.cuotas || []).forEach(function (c) {
     if (!cuotaPagada(c) && c.fecha === f) {
      var m = cuotaPendiente(c);
      entradas = r2(entradas + m);
      detIn.push(p.deudor + ' (#' + c.n + ')');
     }
    });
   });

   (db.alquileres || []).forEach(function (a) {
    if (a.estado !== 'Inactivo' && Number(a.diaCobro || 5) === dNum) {
     var com = r2(num(a.rentaDOP) * (num(a.comisionPct) || 10) / 100);
     var ing = a.origenInmueble === 'CONSIGNACION' ? com : num(a.rentaDOP);
     entradas = r2(entradas + ing);
     detIn.push('Renta ' + a.inquilino);
    }
   });

   (db.igualas || []).forEach(function (ig) {
    if (ig.estado !== 'Inactiva' && Number(ig.diaCobro || 5) === dNum) {
     entradas = r2(entradas + num(ig.montoDOP));
     detIn.push('Iguala ' + ig.cliente);
    }
   });

   (db.pasivos || []).forEach(function (ps) {
    if (num(ps.saldoDOP) > 0 && Number(ps.diaPago || 15) === dNum) {
     salidas = r2(salidas + num(ps.cuotaMensualDOP));
     detOut.push(ps.acreedor);
    }
   });

   saldoAcum = r2(saldoAcum + entradas - salidas);
   if (saldoAcum < minSaldo) { minSaldo = saldoAcum; fechaMin = f; }
   dias.push({ fecha: f, entradas: entradas, salidas: salidas, saldoCierre: saldoAcum, detIn: detIn, detOut: detOut });
  }
  return { dias: dias, minSaldo: minSaldo, fechaMin: fechaMin };
 }

    <button class="btn btn-primary" onclick="App.closeModal()">Cerrar</button>
   </div>
  </div></div>`);
 };

 /* ---------------- 5 · ALERTA DE CONCENTRACIÓN DE RIESGO POR DEUDOR (REGLA DEL 20%) Y 6 · PRODUCTIVIDAD POR COBRADOR ---------------- */
 function calcConcentracionDeudor(deudorId) {
  var totalCartera = sum(db.prestamos || [], saldoCapitalP);
  if (totalCartera <= 0) return { saldo: 0, pct: 0, alerta: false };
  var saldoDeudor = sum((db.prestamos || []).filter(function (p) { return p.deudorId === deudorId; }), saldoCapitalP);
  var pctVal = r2((saldoDeudor / totalCartera) * 100);
  return { saldo: saldoDeudor, pct: pctVal, alerta: pctVal >= 20 };
 }

 /* Guardar qué usuario registró cada cobro para medir productividad y comisiones de cobradores */
 var _v70RegCobro = registrarCobro;
 registrarCobro = function (p, opts) {
  var rec = _v70RegCobro(p, opts);
  if (rec) {
   var u = getActiveUser();
   rec.cobradoPorId = u.id;
   rec.cobradoPorNombre = u.nombre;
   rec.cobradoPorRol = u.rol;
  }
  return rec;
 };

 root.App.openProductividadUsuariosModal = function () {
  var usuarios = ensureUsuariosInit();
  var pctComision = num(db.config && db.config.pctComisionCobrador) || 2;
  var recs = recibosValidos().filter(function (r) { return inGlobalPeriod(r.fecha); });

  openModal(`<div class="modal-backdrop" onclick="if(event.target===this)App.closeModal()"><div class="modal-card lg">
   <div class="modal-head">
    <div>
     <h3>🏆 Productividad de Cobranza y Comisiones por Usuario (${esc(periodLabel())})</h3>
     <p>Mide el efectivo real recuperado por cada usuario/cobrador y calcula su incentivo sobre lo cobrado</p>
    </div>
    <button class="btn btn-outline btn-sm" onclick="App.closeModal()">&times;</button>
   </div>
   <div class="modal-body stack">
    <div class="row wrap" style="gap:10px">
     <span class="mini">% Comisión sobre Interés + Mora recuperada:</span>
     <input class="input" id="prod-pct-com" type="number" step="0.5" style="width:90px;height:32px" value="${pctComision}" onchange="db.config.pctComisionCobrador=Number(this.value)||0;save(true);App.openProductividadUsuariosModal()">
    </div>
    <div class="card"><div class="card-body tight table-wrap">
     <table class="table">
      <thead><tr><th>Usuario / Cobrador</th><th>Rol</th><th class="num">Recibos Emitidos</th><th class="num">Total Cobrado</th><th class="num">Interés + Mora</th><th class="num">Comisión (${pct(pctComision)})</th></tr></thead>
      <tbody>${usuarios.map(function (u) {
       var misRecs = recs.filter(function (r) {
        if (r.cobradoPorId) return r.cobradoPorId === u.id;
        return u.rol === 'admin';
       });
       var tot = r2(sum(misRecs, function (r) { return num(r.montoDOP); }));
       var intMora = r2(sum(misRecs, function (r) { return num(r.interesDOP) + num(r.moraDOP); }));
       var com = r2(intMora * (pctComision / 100));
       return `<tr>
        <td class="strong">${esc(u.nombre)}</td>
        <td><span class="badge ${rolBadgeClass(u.rol)}">${rolDisplay(u.rol)}</span></td>
        <td class="num">${misRecs.length}</td>
        <td class="num strong">${money(tot)}</td>
        <td class="num pos">${money(intMora)}</td>
        <td class="num strong">${money(com)}</td>
       </tr>`;
      }).join('')}</tbody>
     </table>
    </div></div>
   </div>
   <div class="modal-foot">
    <button class="btn btn-primary" onclick="App.closeModal()">Cerrar</button>
   </div>
  </div></div>`);
 };

 var _origViewDeudores = viewDeudores;
 viewDeudores = function () {
  var html = _origViewDeudores();
  (db.deudores || []).forEach(function (d) {
   var conc = calcConcentracionDeudor(d.id);
   var marker = `<div class="kv"><span>Límite aprobado actual</span><span>${money(d.limiteCreditoDOP)}</span></div>`;
   var rowConc = marker + `\n <div class="kv"><span>Concentración en cartera</span><span class="${conc.alerta ? 'neg strong' : 'strong'}">${pct(conc.pct)} ${conc.alerta ? '⚠️ (>20%)' : '✓'}</span></div>`;
   html = html.replace(marker, rowConc);
  });
  return html;
 };

 render();

})(typeof window !== 'undefined' ? window : globalThis);
